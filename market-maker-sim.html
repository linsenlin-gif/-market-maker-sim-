function readCsvFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { $('csvText').value = String(rd.result || ''); $('csvOut').innerHTML = `<li class="okl">已读入文件 ${f.name}，按“解析并导入”。</li>`; };
  rd.onerror = () => { $('csvOut').innerHTML = `<li>读不了这个文件：${f.name}</li>`; };
  rd.readAsText(f);
}
function doImport(ignoreRowErrors) {
  const res = CSV.parse($('csvText').value, { iv: (LAB || {}).iv || SET.iv });
  const S = res.meta.underlying || parseFloat($('csvS').value);
  const asof = res.meta.asof != null ? res.meta.asof : CSV.parseAsof($('csvAsof').value);
  const asofText = res.meta.asofText || $('csvAsof').value;
  const fatal = res.errors.filter(e => e.line === 0 || /表头/.test(e.msg));
  if (!(S > 0)) fatal.push({ line: 0, msg: '请填写标的现价（或在 CSV 首行写 # underlying=…）' });
  if (isNaN(asof)) fatal.push({ line: 0, msg: '计算时刻看不懂，请写成 2026-09-28T15:07-04:00' });
  const rowErr = res.errors.filter(e => !fatal.includes(e));
  const cells = [], warn = res.warnings.slice(), expired = new Set();
  let noExp = false;
  if (!fatal.length) for (const r of res.rows) {
    let minutes;
    if (r.expiry) { minutes = CSV.tradingMinutes(asof, CSV.expiryClose(r.expiry)); if (minutes <= 0) { expired.add(r.expiry); continue; } }
    else { minutes = 390; noExp = true; }
    const exp = r.expiry || '未注明';
    const ex = cells.find(c => c.K === r.K && c.type === r.type && c.expiry === exp);
    if (ex) ex.oi += r.oi; else cells.push({ K: r.K, type: r.type, oi: r.oi, iv: r.iv || undefined, expiry: exp, minutes });
  }
  if (expired.size) warn.push(`这些到期日在计算时刻已经过了，已跳过：${[...expired].join('、')}`);
  if (noExp) warn.push('没有到期日列，按剩余 390 分钟（1 个交易日）计算');
  const out = [];
  fatal.concat(rowErr).forEach(e => out.push(`<li>${e.line ? `第 ${e.line} 行：` : ''}${e.msg}</li>`));
  warn.forEach(w => out.push(`<li class="okl">提示：${w}</li>`));
  const box = $('csvOut');
  requestAnimationFrame(() => box.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' }));
  if (fatal.length) { box.innerHTML = out.join(''); return; }
  if (!cells.length) { box.innerHTML = out.join('') + '<li>没有可以导入的行。</li>'; return; }
  if (rowErr.length && !ignoreRowErrors) {
    box.innerHTML = out.join('') + `<li class="okl">其余 ${res.rows.length} 行没问题。<button class="btn small primary" data-imp="force">忽略出错的行，导入其余 ${res.rows.length} 行</button></li>`;
    return;
  }
  const expiries = [...new Set(cells.map(c => c.expiry))].sort();
  const minMinutes = Math.min(...cells.map(c => c.minutes));
  const soon = cells.filter(c => c.minutes === minMinutes);
  const maxOi = Math.max(...cells.map(c => c.oi));
  const ksAbove = soon.filter(c => c.K >= S).map(c => c.K).sort((a, b) => a - b);
  const ksBelow = soon.filter(c => c.K <= S).map(c => c.K).sort((a, b) => b - a);
  const hidden = [];
  if (ksAbove.length) hidden.push({ K: ksAbove[0], type: 'C', oi: Math.round(maxOi * 0.6 / 100) * 100, side: 'sell', minutes: minMinutes, expiry: soon[0].expiry });
  if (ksBelow.length) hidden.push({ K: ksBelow[0], type: 'P', oi: Math.round(maxOi * 0.4 / 100) * 100, side: 'sell', minutes: minMinutes, expiry: soon[0].expiry });
  const iv = (LAB || {}).iv || SET.iv;
  LAB = makeLab('normal');
  Object.assign(LAB, {
    preset: null, cells, hidden, S: Math.round(S * 100) / 100, S0: S, iv, stance: 'default', showHidden: false, elapsed: 0,
    imported: { n: res.rows.length, expiries, minMinutes, asofText, hasIv: cells.some(c => c.iv), warnings: warn }
  });
  closeModal();
  setView('lab');
  render();
  toast(`已导入 ${cells.length} 个格子（${expiries.length} 个到期日）`);
}

// 频繁重绘的区域里，按钮可能在按下和抬起之间被换掉：按下时记住按钮的数据，抬起时执行
function onTap(container, handler) {
  let down = null;
  container.addEventListener('pointerdown', e => {
    const b = e.target.closest('button');
    down = b && !b.disabled && container.contains(b) ? { x: e.clientX, y: e.clientY, data: { ...b.dataset }, el: b } : null;
  });
  container.addEventListener('pointerup', e => {
    const d = down; down = null;
    if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return;
    handler(d.data, d.el, e);
  });
  container.addEventListener('pointercancel', () => { down = null; });
  container.addEventListener('click', e => {                     // 键盘（回车/空格）触发的点击
    if (e.detail !== 0) return;
    const b = e.target.closest('button');
    if (b && !b.disabled && container.contains(b)) handler({ ...b.dataset }, b, e);
  });
}
let rafPending = 0;
function scheduleRender() {
  if (rafPending) return;
  rafPending = requestAnimationFrame(() => { rafPending = 0; render(); });
}
function setSpeed(v) { UI.speed = v; if (UI.running) schedule(); renderTop(); }
function setMode(v) { if (!G || G.ended) return; G.mode = v; render(); }
function stockWhy(q) {
  const d = Core.greeks(G).delta;
  return Math.abs(d + q) < Math.abs(d) ? '为对冲 Delta' : '手动下单（让涨跌效果离 0 更远）';
}
function optOrder(t, K, qty) {
  if (!qty || !LEVELS[G.level].allowOpt || G.ended) return;
  const og = P.gamma(t, G.S, K, P.years(G.minutes), SET.iv) * MULT * qty;
  const gm = Core.greeks(G).gamma;
  Core.optionTrade(G, t, K, qty, Math.abs(gm + og) < Math.abs(gm) ? '为对冲 Gamma' : '手动下单期权');
}
function openCell(t, K) {
  const anchor = document.querySelector(`[data-cell="${t}${K}"]`);
  openPop(anchor, () => cellPop(t, K), 'cell');
  UI.pop.live = true; UI.pop.cell = { t, K };
}
function wfPop(key) {
  const it = PNL_ITEMS.find(x => x.key === key), b = Core.breakdown(G), v = b[key];
  return `<h3>${it.name}</h3><p class="bigv ${fmt.cls(v)}">${fmt.money(v)}</p><p>${it.exp}</p>` +
    (key === 'gamma' && v < -0.5 ? '<p class="lock">现在这一段是负的：这就是做空 Gamma 时，对冲被迫高买低卖的亏损。</p>' : '') +
    (key === 'total' ? `<p class="small-note">前五段加起来 ${fmt.money(b.parts)}，加上“其他” ${fmt.money(b.other)}，等于总盈亏 ${fmt.money(b.total)}。</p>` : '');
}
function applyLook() {
  const r = document.documentElement;
  if (SET.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', SET.theme);
  r.setAttribute('data-colors', SET.colors);
  if ($('segColors')) $('segColors').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.colors === SET.colors)));
  if ($('segTheme')) $('segTheme').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === SET.theme)));
}
function showTests() {
  const res = runSelfTests();
  const passed = res.filter(r => r.pass).length;
  window.__selfTests = res;
  if ($('testSummary')) {
    $('testSummary').textContent = `自检：${passed}/${res.length} 通过`;
    $('tests').innerHTML = res.map(r => `<li>${r.pass ? '✓' : '✗'} ${r.name}<br><span class="muted">${r.detail}</span></li>`).join('');
  }
  console.group(`做市商模拟器自检：${passed}/${res.length} 通过`);
  res.forEach(r => console[r.pass ? 'log' : 'error'](`${r.pass ? '✓' : '✗'} ${r.name} — ${r.detail}`));
  console.groupEnd();
  return res;
}

/* ---------- 价格舞台拖动 ---------- */
function stagePt(e) { const r = $('stage').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function onStageDown(e) {
  if (e.target.closest('button') || !G || G.ended || kindOf() === 'quiz') return;
  const g = UI.stageGeom; if (!g) return;
  const { x, y } = stagePt(e);
  const near = Math.hypot(x - g.lx, y - g.ly) < 48 || x > g.lx - 24;
  if (G.mode !== 'manual') { if (near) toast('切换到“手动”后，就能按住圆点拖动股价'); return; }
  if (!near) return;
  UI.stageDrag = { lo: g.lo, hi: g.hi, pad: g.pad, h: g.h, from: G.S };
  $('stageWrap').setPointerCapture(e.pointerId);
  e.preventDefault();
}
function onStageMove(e) {
  const d = UI.stageDrag; if (!d) return;
  const { y } = stagePt(e);
  let S = d.hi - (y - d.pad.t) / (d.h - d.pad.t - d.pad.b) * (d.hi - d.lo);
  S = Math.max(d.lo, Math.min(d.hi, Math.round(S * 20) / 20));
  if (Math.abs(S - G.S) < 0.001) return;
  Core.move(G, S, G.minutes);
  G.lastCheck = null;
  scheduleRender();
}
function onStageUp() {
  const d = UI.stageDrag; if (!d) return;
  UI.stageDrag = null;
  render();
  if (Math.abs(G.S - d.from) >= 0.005 && UI.stageGeom) spawnFloat(G.S - d.from);
}

/* ---------- 仪表下方的数量条 ---------- */
function onQDown(e) {
  if (!G || G.ended || kindOf() !== 'trade') return;
  const r = $('qbar').getBoundingClientRect();
  UI.qDrag = { x0: e.clientX, half: Math.max(40, r.width / 2 - 36), qty: 0, R: UI.gR };
  UI.qPending = 0;
  const th = $('qThumb'); th.classList.remove('back');
  th.setPointerCapture(e.pointerId);
  e.preventDefault();
}
function onQMove(e) {
  const d = UI.qDrag; if (!d) return;
  const dx = Math.max(-d.half, Math.min(d.half, e.clientX - d.x0));
  const step = d.R <= 2000 ? 10 : d.R <= 20000 ? 100 : 1000;
  d.qty = Math.round(dx / d.half * d.R / step) * step;
  const th = $('qThumb');
  th.style.transform = `translateX(calc(-50% + ${dx}px))`;
  th.textContent = d.qty ? tradeText(d.qty) : '拖我';
  renderGauge();
}
function onQUp() {
  const d = UI.qDrag; if (!d) return;
  UI.qDrag = null; UI.qPending = d.qty;
  const th = $('qThumb'); th.classList.add('back'); th.style.transform = ''; th.textContent = '拖我';
  renderGauge();
}

/* ---------- 订单卡左右滑 ---------- */
function onCardDown(e) {
  const c = e.target.closest('#ocard');
  if (!c || e.target.closest('button')) return;
  UI.swipe = { x0: e.clientX, y0: e.clientY, el: c, dx: 0, active: false, id: e.pointerId };
}
function onCardMove(e) {
  const s = UI.swipe; if (!s) return;
  const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
  if (!s.active) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { s.active = true; try { s.el.setPointerCapture(s.id); } catch (err) { /* 忽略 */ } }
    else if (Math.abs(dy) > 10) { UI.swipe = null; return; }
    else return;
  }
  s.dx = dx;
  s.el.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
  s.el.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / 300));
}
function onCardUp() {
  const s = UI.swipe; if (!s) return;
  UI.swipe = null;
  if (s.active && s.dx > 90) acceptOrder();
  else if (s.active && s.dx < -90) { Core.rejectOrder(G); render(); }
  else { s.el.classList.add('snap'); s.el.style.transform = ''; s.el.style.opacity = ''; render(); }
}

// 键盘快捷键（电脑）
function onKey(e) {
  if (e.key === 'Escape') {
    if (!$('modal').hidden) { closeModal(); render(); }
    else if (UI.pop) closePop();
    else if (UI.drawer) closeDrawer();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || !$('modal').hidden || !G) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const inLevel = UI.view === 'level' && kindOf() !== 'quiz';
  if (k === 'l') { openDrawer('log'); return; }
  if (!inLevel) return;
  const trade = kindOf() === 'trade';
  if (k === ' ' && tag !== 'BUTTON') { e.preventDefault(); if (UI.running) { stop(); render(); } else play(); }
  else if (k === 'ArrowRight') { e.preventDefault(); if (!UI.running) doStep(); }
  else if (k === '1' || k === '2' || k === '5') setSpeed(Number(k));
  else if (k === 'm') setMode(G.mode === 'auto' ? 'manual' : 'auto');
  else if ((k === 'ArrowUp' || k === 'ArrowDown') && G.mode === 'manual' && !G.ended) {
    e.preventDefault();
    const d = (k === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 1 : 0.25);
    if (Math.abs(d) === 1) Core.nudge(G, d); else { Core.move(G, Math.max(1, G.S + d), G.minutes); G.lastCheck = null; }
    render();
  }
  else if (k === 'z' && trade && !G.ended) { $('btnZero').click(); }
  else if (k === 'a' && trade && G.order) acceptOrder();
  else if (k === 'x' && trade && G.order) { Core.rejectOrder(G); render(); }
}
function bind() {
  $('btnStep').innerHTML = ICON.step; $('btnSettings').innerHTML = ICON.gear; $('btnLog').innerHTML = ICON.list; $('drClose').innerHTML = ICON.close;
  $('btnPlay').onclick = () => { if (UI.running) { stop(); render(); } else play(); };
  $('btnStep').onclick = doStep;
  $('segSpeed').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) setSpeed(Number(b.dataset.v)); };
  $('btnSpeed').onclick = () => setSpeed(UI.speed === 1 ? 2 : UI.speed === 2 ? 5 : 1);
  $('segMode').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) setMode(b.dataset.v); };
  $('btnMode').onclick = () => setMode(G.mode === 'auto' ? 'manual' : 'auto');
  $('segView').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
  $('btnLevel').onclick = () => openPop($('btnLevel'), levelMenu, 'menu');
  $('btnSettings').onclick = () => openDrawer('settings');
  $('btnLog').onclick = () => openDrawer('log');
  $('drClose').onclick = closeDrawer;
  $('scrim').onclick = closeDrawer;
  document.addEventListener('click', e => {
    const h = e.target.closest('.help');
    if (h) openPop(h, HELP[h.dataset.help], 'help');
  });
  $('popLayer').addEventListener('pointerdown', e => { if (e.target === $('popLayer')) closePop(); });
  onTap($('pop'), (data) => {
    if (data.level) { closePop(); startLevel(Number(data.level)); return; }
    if (data.act === 'lab') { closePop(); setView('lab'); return; }
    if (data.act === 'intro') { closePop(); if (UI.view !== 'level') setView('level'); openIntro(); return; }
    if (data.act === 'restart') { closePop(); recordRun(); startLevel(G.level, G.bias, false, G.opts); return; }
    if (data.act === 'end') { closePop(); if (!G.ended) endLevel('early'); return; }
    if (data.cq) { UI.cellQty = Math.max(1, Math.min(5000, UI.cellQty + Number(data.cq))); refreshPop(); return; }
    if (!data.ca || !UI.pop || !UI.pop.cell) return;
    const { t, K } = UI.pop.cell;
    if (data.ca === 'buy') optOrder(t, K, UI.cellQty);
    else if (data.ca === 'sell') optOrder(t, K, -UI.cellQty);
    else if (data.ca === 'suggest') optOrder(t, K, Number(data.n));
    else if (data.ca === 'close') { const p = G.pos[t + K]; if (p) Core.optionTrade(G, t, K, -p.qty, '平仓'); }
    render();
  });

  // 价格舞台
  $('stageCtrl').onclick = e => {
    const b = e.target.closest('button'); if (!b || G.ended) return;
    if (b.dataset.news) Core.news(G); else Core.nudge(G, Number(b.dataset.d));
    render();
  };
  const sw = $('stageWrap');
  sw.addEventListener('pointerdown', onStageDown);
  sw.addEventListener('pointermove', onStageMove);
  sw.addEventListener('pointerup', onStageUp);
  sw.addEventListener('pointercancel', onStageUp);

  // 仪表
  $('chkAuto').onchange = e => { G.autoHedge = e.target.checked; if (G.autoHedge && !G.ended) Core.autoHedge(G, '打开自动对冲：把涨跌效果调回 0'); render(); };
  $('btnZero').onclick = () => {
    if (G.ended) return;
    Core.stockTrade(G, -Core.greeks(G).delta, 'hedge', '为对冲 Delta', true);
    UI.coachDone = true; storeSet('mm-coach', '1');
    render();
  };
  $('coachX').onclick = () => { UI.coachDone = true; storeSet('mm-coach', '1'); render(); };
  const th = $('qThumb');
  th.addEventListener('pointerdown', onQDown);
  th.addEventListener('pointermove', onQMove);
  th.addEventListener('pointerup', onQUp);
  th.addEventListener('pointercancel', onQUp);
  onTap($('qConfirm'), data => {
    if (data.q === 'ok' && UI.qPending && !G.ended) Core.stockTrade(G, UI.qPending, 'hedge', stockWhy(UI.qPending), true);
    UI.qPending = 0;
    render();
  });

  // 棋盘
  onTap($('board'), data => {
    if (data.cell) { openCell(data.cell[0], Number(data.cell.slice(1))); return; }
    if (data.gcell) {
      const t = data.gcell[0], K = Number(data.gcell.slice(1));
      openPop(document.querySelector(`[data-gcell="${data.gcell}"]`), () => gexCellPop(t, K), 'gcell');
      UI.pop.live = true;
    }
  });
  ['pointerdown', 'wheel', 'touchstart'].forEach(ev => $('board').addEventListener(ev, () => { UI.boardTouch = Date.now(); }, { passive: true }));
  onTap($('strip'), data => {
    if (data.act === 'details') openDrawer('positions');
    if (data.act === 'closeStock') { const s = G.pos.STK; if (s && !G.ended) { Core.stockTrade(G, -s.qty, 'hedge', '平掉股票', false); render(); } }
  });

  // 盈亏条
  $('btnCompare').onclick = () => { openPop($('btnCompare'), comparePop, 'cmp'); UI.pop.live = true; UI.pop.after = compareAfter; compareAfter(); placePop(); };
  onTap($('pnlBody'), (data, el) => {
    if (data.wf) openPop(document.querySelector(`#pnlBody [data-wf="${data.wf}"]`) || el, () => wfPop(data.wf), 'wf');
  });

  // 收件箱 / 控制台
  $('chkPause').onchange = e => { SET.pauseOnOrder = e.target.checked; };
  onTap($('inboxBody'), data => {
    if (data.order) { if (data.order === 'accept') acceptOrder(); else { Core.rejectOrder(G); render(); } return; }
    if (data.bias) {
      if (data.bias === G.bias) return;
      if (LEVELS[G.level].biasToggle) { recordRun(); startLevel(G.level, data.bias, false); } else { G.bias = data.bias; render(); }
      return;
    }
    if (data.stance) {
      if (data.stance === G.market.stance) return;
      recordRun(); startLevel(G.level, data.stance, false, { hidden: G.showHidden });
      return;
    }
    if (data.push && !G.ended) { Core.news(G, Number(data.push), 0.003); render(); }
  });
  $('inboxBody').addEventListener('input', e => {
    if (e.target.id === 'rngCash') { G.cashIn = Number(e.target.value) / 100; $('cashLab').textContent = Math.round(G.cashIn * 100) + '%'; }
  });
  $('inboxBody').addEventListener('change', e => {
    if (e.target.id === 'chkHidden') { recordRun(); startLevel(G.level, G.market.stance, false, { hidden: e.target.checked }); }
  });
  $('inboxBody').addEventListener('pointerdown', onCardDown);
  document.addEventListener('pointermove', onCardMove);
  document.addEventListener('pointerup', onCardUp);
  document.addEventListener('pointercancel', onCardUp);

  // 手机页签
  onTap($('tabbar'), data => {
    if (!data.tab) return;
    if (data.tab === 'log') { openDrawer('log'); return; }
    UI.tab = data.tab; render();
  });

  // 抽屉（设置）
  const onSet = e => {
    const k = e.target.dataset.set; if (!k) return;
    const v = parseFloat(e.target.value);
    if (k === 'iv') { SET.iv = v / 100; $('ivVal').textContent = Math.round(v) + '%'; if (LAB) { LAB.iv = SET.iv; LAB.version++; } }
    else if (k === 'pull') SET.pull[G.level] = Math.max(0, v || 0);
    else if (k === 'startMin') { if (v >= 5) SET.startMin[G.level] = Math.min(1950, Math.round(v)); }
    else if (!isNaN(v)) SET[k] = Math.max(0, v);
    scheduleRender();
  };
  $('drBody').addEventListener('input', onSet);
  $('drBody').addEventListener('change', onSet);
  $('drBody').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.colors) { SET.colors = b.dataset.colors; applyLook(); render(); }
    if (b.dataset.theme) { SET.theme = b.dataset.theme; applyLook(); render(); }
    if (b.dataset.act === 'retest') showTests();
  });

  // 弹窗
  $('sheet').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pg) { UI.pages.i += b.dataset.pg === 'next' ? 1 : -1; renderPages(); return; }
    if (b.dataset.imp === 'sample') { $('csvText').value = CSV_SAMPLE; $('csvS').value = ''; return; }
    if (b.dataset.imp === 'go') { doImport(false); return; }
    if (b.dataset.imp === 'force') { doImport(true); return; }
    const a = b.dataset.act;
    if (a === 'close') { closeModal(); render(); }
    else if (a === 'retry') { closeModal(); startLevel(G.level, G.bias, false, G.opts); }
    else if (a === 'next') { closeModal(); startLevel(G.level + 1); }
    else if (a === 'lab') { closeModal(); setView('lab'); }
  });
  $('sheet').addEventListener('change', e => { if (e.target.id === 'csvFile') readCsvFile(e.target); });

  // 实验室
  const lc = $('labCanvas');
  lc.addEventListener('pointerdown', onLabDown);
  lc.addEventListener('pointermove', onLabMove);
  lc.addEventListener('pointerup', onLabUp);
  lc.addEventListener('pointercancel', onLabUp);
  onTap($('labCtrl'), onLabCtrlTap);
  $('labCtrl').addEventListener('input', onLabCtrlInput);
  $('labCtrl').addEventListener('change', onLabCtrlInput);
  onTap($('labSide'), onLabSide);

  document.addEventListener('keydown', onKey);
  // 电脑：在价格舞台上滚动滚轮拨动股价（手动模式）
  $('stageWrap').addEventListener('wheel', e => {
    if (!G || G.ended || G.mode !== 'manual' || kindOf() === 'quiz') return;
    e.preventDefault();
    const d = (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 1 : 0.25);
    Core.move(G, Math.max(1, G.S + d), G.minutes); G.lastCheck = null;
    scheduleRender();
  }, { passive: false });
  // 鼠标指针形状：能拖的地方给出提示
  $('stageWrap').addEventListener('pointermove', e => {
    if (UI.stageDrag || e.pointerType !== 'mouse') return;
    const g = UI.stageGeom; if (!g || !G) return;
    const { x, y } = stagePt(e);
    $('stage').style.cursor = G.mode === 'manual' && (Math.hypot(x - g.lx, y - g.ly) < 48 || x > g.lx - 24) ? 'ns-resize' : 'default';
  });
  $('labCanvas').addEventListener('pointermove', e => {
    const st = activeLab(), L = st && st._layout;
    if (!L || st._drag || e.pointerType !== 'mouse') return;
    const { x, y } = labPoint(e);
    const hit = L.hits.find(hb => x >= hb.x0 - 3 && x <= hb.x1 + 3 && y > L.pad.t && y < L.h - L.pad.b);
    $('labCanvas').style.cursor = Math.abs(x - L.X(st.S)) < 16 || !hit ? 'ew-resize' : (st.readOnly ? 'pointer' : 'ns-resize');
  });
  document.querySelectorAll('.ibtn[aria-label]').forEach(b => { b.title = b.getAttribute('aria-label'); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (G) { if (UI.pop) placePop(); scheduleRender(); } }).observe($('main'));
  window.addEventListener('resize', () => G && scheduleRender());
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => G && render());
  }
}

/* =====================================================================
 * 20. 启动
 * ===================================================================== */
function boot(data) {
  bind();
  UI.coachDone = storeGet('mm-coach') === '1';
  if (data && data.G && data.SET) {
    SET = data.SET; G = data.G; G.set = SET; LAB = data.LAB || null; UI.runs = data.runs || {};
    UI.lastSeq = G.logSeq || 0;
    applyLook(); render();
  } else {
    applyLook();
    const saved = Number(storeGet('mm-sim-level'));
    startLevel(LEVELS[saved] ? saved : 1);
  }
  showTests();
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({
      G: JSON.parse(JSON.stringify({ ...G, set: undefined })), SET,
      LAB: LAB ? JSON.parse(JSON.stringify(LAB)) : null, runs: UI.runs
    }));
  }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
