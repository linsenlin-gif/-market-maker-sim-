<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>做市商模拟器</title>
<style>
/* 布局：一屏应用，不滚动页面。iPad 横屏左舞台（价格 + 棋盘）右状态（仪表 + 盈亏 + 收件箱）；iPad 竖屏上舞台、中仪表|盈亏、下棋盘|收件箱；手机舞台 + 仪表常驻，其余放底部页签 */
:root {
  --bg: #e6eaef;
  --panel: #f9fafb;
  --panel-2: #edf1f5;
  --ink: #142029;
  --muted: #5a6877;
  --line: #d2d9e1;
  --chip: #e0e6ed;
  --accent: #2257b8;
  --accent-ink: #ffffff;
  --accent-soft: #dbe5f7;
  --red: #cc3325;
  --green: #0e8753;
  --warn: #b0640a;
  --warn-soft: #f6e8d2;
  --call: #1b8aa0;
  --put: #8a4fd0;
  --scrim: rgba(15, 22, 30, 0.5);
  --pos: var(--red);
  --neg: var(--green);
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Roboto Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217; --panel: #161e26; --panel-2: #1d2731; --ink: #e4ebf2; --muted: #93a2b2; --line: #2a3541; --chip: #24303b;
    --accent: #7aa2ff; --accent-ink: #0b1220; --accent-soft: #1f2d48;
    --red: #ff6a5c; --green: #3bcf8b; --warn: #f0b73c; --warn-soft: #3a2f17;
    --call: #4cc3d9; --put: #b98cf0; --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217; --panel: #161e26; --panel-2: #1d2731; --ink: #e4ebf2; --muted: #93a2b2; --line: #2a3541; --chip: #24303b;
  --accent: #7aa2ff; --accent-ink: #0b1220; --accent-soft: #1f2d48;
  --red: #ff6a5c; --green: #3bcf8b; --warn: #f0b73c; --warn-soft: #3a2f17;
  --call: #4cc3d9; --put: #b98cf0; --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
/* 颜色习惯：默认红涨绿跌（做多/买入 = 红）；可切换为绿涨红跌 */
:root[data-colors="us"] { --pos: var(--green); --neg: var(--red); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--ink);
  font: 0.875rem/1.45 var(--font-ui);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.muted { color: var(--muted); }
.gpos { color: var(--accent); }
.gneg { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100vh;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden;
}

/* ---------- 顶部条 ---------- */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding: 6px 16px; min-height: 56px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.tb-quote { display: flex; align-items: baseline; gap: 8px; }
.sym { font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
.px { font-family: var(--font-num); font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.chg { font-family: var(--font-num); font-size: 0.78rem; }
.tb-time { display: grid; line-height: 1.1; font-size: 0.68rem; color: var(--muted); }
.tb-time b { font-family: var(--font-num); font-size: 0.95rem; color: var(--ink); }
.tb-level {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; max-width: 260px;
  padding: 4px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-weight: 800;
}
.tb-level span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-level svg { width: 16px; height: 16px; flex: none; }
.badge { font-size: 0.76rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.badge.calm { color: var(--accent); }
.badge.wild { color: var(--warn); }
.tb-ctrls { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.ibtn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; padding: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
}
.ibtn svg { width: 20px; height: 20px; }
.ibtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ibtn.txt { width: auto; min-width: 44px; padding: 0 10px; font-weight: 800; font-family: var(--font-num); }
.ibtn:disabled, .btn:disabled, .seg button:disabled, .stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.seg button { border: 0; background: transparent; min-height: 44px; padding: 4px 12px; font-weight: 700; white-space: nowrap; }
.seg.small button { padding: 4px 9px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.wrap-seg { display: flex; flex-wrap: wrap; }
.seg.wrap-seg button { flex: 1 1 auto; font-size: 0.8rem; white-space: normal; }
.only-phone { display: none !important; }
#btnSpeed { display: none; }
@media (max-width: 1299px) {
  #segSpeed { display: none; }
  #btnSpeed { display: inline-grid; }
  .sym, .chg .pct { display: none; }
}

/* ---------- 主区域 ---------- */
.main { min-height: 0; padding: 10px 16px; overflow: hidden; }
.view { height: 100%; min-height: 0; display: grid; gap: 10px; }
#levelView {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 36fr) auto minmax(0, 52fr);
  grid-template-areas: "stage" "gauge" "tab";
}
#cStage { grid-area: stage; }
#cGauge { grid-area: gauge; }
.tabbed { grid-area: tab; display: none !important; }
.tabbed.on { display: flex !important; }
#labView {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 44fr) minmax(0, 24fr) minmax(0, 32fr);
  grid-template-areas: "chart" "side" "ctrl";
}
#cLabChart { grid-area: chart; }
#cLabSide { grid-area: side; }
#cLabCtrl { grid-area: ctrl; }
.tabbar { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 0 16px; }
.tabbar button {
  flex: 1; min-height: 48px; border: 0; background: none; font-weight: 800; color: var(--muted); position: relative;
}
.tabbar button.on { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.tabbar button.dot::after {
  content: ""; position: absolute; top: 9px; right: calc(50% - 30px); width: 9px; height: 9px; border-radius: 50%; background: var(--warn);
}

@media (min-width: 641px) and (min-height: 560px) {
  #levelView {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 28fr) minmax(0, 38fr) minmax(0, 34fr);
    grid-template-areas: "stage stage" "gauge pnl" "board inbox";
  }
  #cPnl { grid-area: pnl; }
  #cBoard { grid-area: board; }
  #cInbox { grid-area: inbox; }
  .tabbed { display: flex !important; }
  .tabbar { display: none; }
  #labView {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 54fr) minmax(0, 46fr);
    grid-template-areas: "chart chart" "side ctrl";
  }
}
@media (min-width: 1000px) and (min-aspect-ratio: 1/1) and (min-height: 560px) {
  #levelView {
    grid-template-columns: minmax(0, 62fr) minmax(0, 38fr);
    grid-template-rows: minmax(0, 48fr) minmax(0, 7fr) minmax(0, 12fr) minmax(0, 33fr);
    grid-template-areas: "stage gauge" "stage pnl" "board pnl" "board inbox";
  }
  #labView {
    grid-template-columns: minmax(0, 62fr) minmax(0, 38fr);
    grid-template-rows: minmax(0, 46fr) minmax(0, 54fr);
    grid-template-areas: "chart side" "chart ctrl";
  }
}
/* 电脑宽屏：三栏（左 价格舞台 + 棋盘，中 仪表 + 盈亏，右 订单），用宽度换高度，适合矮一些的笔记本浏览器窗口 */
@media (min-width: 1200px) and (min-aspect-ratio: 3/2) and (min-height: 560px) {
  #levelView {
    grid-template-columns: minmax(0, 43fr) minmax(0, 31fr) minmax(0, 26fr);
    grid-template-rows: minmax(0, 50fr) minmax(0, 12fr) minmax(0, 38fr);
    grid-template-areas: "stage gauge inbox" "board gauge inbox" "board pnl inbox";
  }
}
/* 大屏幕：整体字号放大 */
@media (min-width: 1700px) and (min-height: 860px) { html { font-size: 17px; } }
@media (min-width: 2200px) and (min-height: 1100px) { html { font-size: 19px; } }
/* 鼠标：棋盘行可以矮一点；悬停有反馈 */
@media (pointer: fine) {
  .board { grid-auto-rows: minmax(32px, 1fr); }
  .cell { min-height: 32px; }
}
@media (hover: hover) {
  .btn:not(:disabled):hover, .ibtn:not(:disabled):hover, .seg button:not(:disabled):not([aria-pressed="true"]):hover,
  .presets button:hover, .choice button:hover, .stepper button:not(:disabled):hover, .menu button:not(:disabled):hover,
  .tb-level:hover, .tabbar button:hover, .stage-ctrl button:not(:disabled):hover {
    box-shadow: inset 0 0 0 999px rgba(127, 140, 160, 0.14);
  }
  .cell:hover { border-color: var(--accent); }
  .wf-col:hover { background: var(--panel-2); }
  .help:hover span { border-color: var(--accent); color: var(--accent); }
}
.kbd { font-family: var(--font-num); font-size: 0.78rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--panel-2); white-space: nowrap; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.84rem; align-items: center; }
@media (max-width: 640px), (max-height: 559px) {
  .top { gap: 4px 8px; padding-block: 4px; }
  .px { font-size: 1.2rem; }
  .sym, .tb-time span { display: none; }
  .tb-level { max-width: 168px; padding: 4px 8px; }
  .tb-ctrls { margin-left: 0; width: 100%; justify-content: space-between; }
  .only-wide { display: none !important; }
  .only-phone { display: inline-grid !important; }
  .g-long { display: none; }
  #gCheck { display: none; }
  .gauge { height: 58px; }
  .card > header { min-height: 40px; }
  .help { width: 40px; height: 40px; }
  #tbBadge, #gexNote, .legend .lg-long { display: none !important; }
  .bigv { font-size: 1rem; }
  .kv { flex-wrap: wrap; }
  .g-val { font-size: 1.05rem; }
  #btnZero { font-size: 0.85rem; min-height: 42px; }
  .qbar { height: 40px; }
  .q-thumb { height: 30px; }
}
.g-short { display: none; }
@media (max-width: 640px), (max-height: 559px) { .g-short { display: inline; } }

/* ---------- 卡片 ---------- */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.card > header { display: flex; align-items: center; gap: 6px; padding: 0 2px 0 12px; min-height: 44px; flex: none; }
.card > header h2 { font-size: 0.92rem; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card > header .grow { flex: 1; min-width: 0; }
.card > header .note { font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.help { width: 44px; height: 44px; flex: none; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.help span {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted);
  display: grid; place-items: center; font-weight: 800; font-size: 0.8rem;
}
.body { flex: 1; min-height: 0; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overflow-anchor: none; }
.term { display: inline-block; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--ink); vertical-align: 1px; }
.btn { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; min-height: 44px; padding: 6px 14px; font-weight: 800; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.buy { background: var(--pos); border-color: var(--pos); color: #fff; }
.btn.sell { background: var(--neg); border-color: var(--neg); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 4px 10px; font-size: 0.82rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1; }
.switch { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.kv { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 0.8rem; }
.kv b { font-family: var(--font-num); text-align: right; }
.bigv { font-family: var(--font-num); font-size: 1.2rem; font-weight: 800; }
.small-note { font-size: 0.74rem; color: var(--muted); }

/* ---------- 价格舞台 ---------- */
.stage-wrap { position: relative; flex: 1; min-height: 0; touch-action: none; }
.stage-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage-ctrl { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 6px; }
.stage-ctrl button {
  min-width: 50px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
  font-family: var(--font-num); font-weight: 800;
}
.float {
  position: absolute; pointer-events: none; font-family: var(--font-num); font-weight: 800; font-size: 0.82rem;
  animation: floatup 0.9s ease-out forwards;
}
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

/* ---------- 涨跌效果仪表 ---------- */
.gbody { gap: 4px; overflow-y: auto; }
.g-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.g-val { font-size: 1.25rem; font-weight: 800; }
.pill { font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--accent); }
.pill.off { color: var(--warn); }
.gauge { position: relative; height: 66px; margin: 0 34px; flex: none; }
.g-track { position: absolute; left: 0; right: 0; top: 24px; height: 18px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); }
.g-track::before, .g-track::after { content: ""; position: absolute; top: 0; bottom: 0; width: 50%; opacity: 0.16; }
.g-track::before { left: 0; background: var(--neg); border-radius: 9px 0 0 9px; }
.g-track::after { right: 0; background: var(--pos); border-radius: 0 9px 9px 0; }
.g-zero { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); opacity: 0.55; }
.g-tick { position: absolute; top: 3px; bottom: 3px; width: 1px; background: var(--muted); opacity: 0.45; }
.g-needle {
  position: absolute; top: 15px; height: 36px; width: 6px; margin-left: -3px; border-radius: 3px;
  background: var(--ink); box-shadow: 0 0 0 2px var(--panel); transition: left 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 2;
}
.g-ghost {
  position: absolute; top: 19px; height: 28px; width: 4px; margin-left: -2px; border-radius: 2px;
  background: var(--ink); opacity: 0.38; transition: left 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.g-ghost span, .g-prev span {
  position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 0.66rem; font-weight: 800; color: var(--ink);
}
.g-ghost.up span { top: -18px; }
.g-ghost.dn span { top: 30px; }
.g-ghost.l span, .g-prev.l span { transform: none; left: -2px; }
.g-ghost.r span, .g-prev.r span { transform: translateX(-100%); left: 6px; }
.g-prev { position: absolute; top: 12px; height: 42px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--accent); opacity: 0.85; z-index: 1; }
.g-prev span { top: -16px; color: var(--accent); }
.g-bubble {
  position: absolute; top: 0; transform: translateX(-50%); z-index: 3; pointer-events: none;
  background: var(--ink); color: var(--panel); font-size: 0.72rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; white-space: nowrap;
  animation: bub 1.9s ease-out forwards;
}
.g-bubble.bad { background: var(--neg); color: #fff; }
.g-bubble.good { background: var(--pos); color: #fff; }
@keyframes bub { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.g-scale { display: flex; justify-content: space-between; font-size: 0.66rem; color: var(--muted); font-family: var(--font-num); padding: 0 4px; }
.g-line { font-size: 0.8rem; }
.g-actions { display: flex; gap: 8px; align-items: center; }
#btnZero { flex: 1; min-height: 46px; font-size: 0.95rem; }
.hourglass { display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 800; white-space: nowrap; }
.hourglass svg { width: 18px; height: 18px; }
.qbar {
  position: relative; height: 44px; border-radius: 12px; background: var(--panel-2); border: 1px dashed var(--muted);
  flex: none; touch-action: none; overflow: hidden;
}
.q-track { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 0.72rem; color: var(--muted); pointer-events: none; }
.q-thumb {
  position: absolute; left: 50%; top: 4px; min-width: 64px; padding: 0 10px; height: 34px; transform: translateX(-50%); border-radius: 10px; white-space: nowrap;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 0.74rem; font-weight: 800;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22); cursor: grab;
}
.q-thumb.back { transition: transform 0.2s ease; }
.q-confirm { display: flex; align-items: center; gap: 8px; background: var(--warn-soft); border-radius: 10px; padding: 4px 6px 4px 10px; font-size: 0.82rem; font-weight: 700; }
.q-confirm span { flex: 1; }
.g-actions { position: relative; }
.coach {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 4; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  background: var(--ink); color: var(--panel); border-radius: 10px; padding: 8px 44px 8px 10px; font-size: 0.8rem; font-weight: 700;
}
.coach::after { content: ""; position: absolute; left: 40px; bottom: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
.coach button { position: absolute; right: 0; top: 0; width: 44px; height: 100%; border: 0; background: none; color: var(--panel); font-size: 1rem; }
.gex-note { font-size: 0.8rem; background: var(--accent-soft); border-radius: 10px; padding: 6px 10px; }

/* ---------- 期权棋盘 ---------- */
.board {
  flex: 1; min-height: 0; display: grid; position: relative; overflow-y: auto;
  grid-template-columns: 54px minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto; grid-auto-rows: minmax(42px, 1fr); gap: 4px;
}
.bh { font-size: 0.72rem; color: var(--muted); font-weight: 800; text-align: center; padding-bottom: 2px; position: sticky; top: 0; z-index: 3; background: var(--panel); }
.bk {
  display: grid; place-items: center; font-family: var(--font-num); font-weight: 800; font-size: 0.88rem;
  border-radius: 8px; background: var(--panel-2); line-height: 1.1; text-align: center;
}
.bk small { display: block; font-size: 0.6rem; font-weight: 700; }
.cell {
  position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 2px 8px; min-height: 42px; overflow: hidden; text-align: left;
}
.cell::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: var(--a, 0); pointer-events: none; transition: opacity 0.3s; }
.cell > * { position: relative; }

<script>
'use strict';

/* =====================================================================
 * 1. 定价与希腊值（Black-Scholes，r = q = 0）
 * ===================================================================== */
const Pricing = (() => {
  const MIN_PER_YEAR = 252 * 390;            // 一年的交易分钟数
  // 互补误差函数，精确到机器精度：|x| < 3 用正项级数，|x| ≥ 3 用连分式；满足 erfc(-x) = 2 - erfc(x)
  // （常见的多项式近似在 0 点有折角，会让平值期权的 Gamma 有限差分对不上）
  function erfc(x) {
    if (x < 0) return 2 - erfc(-x);
    if (x < 3) {
      let term = x, sum = x;
      for (let n = 1; n < 200 && term > 1e-17 * sum; n++) { term *= 2 * x * x / (2 * n + 1); sum += term; }
      return 1 - 2 / Math.sqrt(Math.PI) * Math.exp(-x * x) * sum;
    }
    let k = x;
    for (let n = 60; n >= 1; n--) k = x + (n / 2) / k;
    return Math.exp(-x * x) / (Math.sqrt(Math.PI) * k);
  }
  const N = x => 0.5 * erfc(-x / Math.SQRT2);
  const pdf = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
  const years = minutes => Math.max(minutes, 0) / MIN_PER_YEAR;
  function d1d2(S, K, T, v) {
    const sv = v * Math.sqrt(T);
    const d1 = (Math.log(S / K) + 0.5 * v * v * T) / sv;
    return [d1, d1 - sv, sv];
  }
  function intrinsic(type, S, K) { return type === 'C' ? Math.max(S - K, 0) : Math.max(K - S, 0); }
  function price(type, S, K, T, v) {
    if (T <= 0) return intrinsic(type, S, K);
    const [d1, d2] = d1d2(S, K, T, v);
    return type === 'C' ? S * N(d1) - K * N(d2) : K * N(-d2) - S * N(-d1);
  }
  function delta(type, S, K, T, v) {
    if (T <= 0) {
      if (S === K) return type === 'C' ? 0.5 : -0.5;
      return type === 'C' ? (S > K ? 1 : 0) : (S < K ? -1 : 0);
    }
    const [d1] = d1d2(S, K, T, v);
    return type === 'C' ? N(d1) : N(d1) - 1;
  }
  function gamma(type, S, K, T, v) {
    if (T <= 0) return 0;
    const [d1, , sv] = d1d2(S, K, T, v);
    return pdf(d1) / (S * sv);
  }
  // 每年的 Theta（r = 0 时 call 和 put 相同）
  function theta(type, S, K, T, v) {
    if (T <= 0) return 0;
    const [d1] = d1d2(S, K, T, v);
    return -S * pdf(d1) * v / (2 * Math.sqrt(T));
  }
  return { MIN_PER_YEAR, N, pdf, years, intrinsic, price, delta, gamma, theta };
})();

  gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  weighted(w) { const ks = Object.keys(w); let t = 0; ks.forEach(k => t += w[k]); let x = Math.random() * t; for (const k of ks) { x -= w[k]; if (x <= 0) return +k; } return +ks[ks.length - 1]; }
};

fmt.big = n => {

  if (a >= 1e6) return Math.round(a / 1e4).toLocaleString('en-US') + ' 万';

  return Math.round(a).toLocaleString('en-US');
};
fmt.sbig = n => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '') + fmt.big(n);
fmt.moneyShort = n => {

const LEVEL_IDS = Object.keys(LEVELS).map(Number);

/* =====================================================================
 * 4. 市场模拟、持仓与盈亏、订单流（核心逻辑，不碰界面；沿用 v1）
 * ===================================================================== */
const P = Pricing;
const Core = {
  newGame(level, set, bias, opts) {
    const L = LEVELS[level];
    const startMin = set.startMin[level];
    const g = {
      level, set, S: S0, minutes: startMin, startMin, step: 0,
      mode: 'auto', autoHedge: L.autoHedge, bias: bias || L.bias,
      pos: {}, cash: 0, trades: [],
      pnl: { spread: 0, hedge: 0, delta: 0, gamma: 0, theta: 0 },
      stockLoss: 0, stockGain: 0, volume: 0,
      pattern: { upBuy: 0, upSell: 0, downBuy: 0, downSell: 0 }, clientSinceMove: false, lastDS: 0,
      order: null, orderSeq: 0, nextOrderIn: L.firstOrder,
      pendingFlow: 0, hist: [{ m: startMin, S: S0 }], gHist: [],
      ended: false, endReason: '', lastMove: null, lastCheck: null,
      sumDist: 0, maxDist: 0, thetaPeak: 0, gammaPeak: 0, gamma0: 0,
      logSeq: 0, lastImpact: 0, dsHist: [], recentOrders: [], opts: opts || {}
    };
    if (L.startS) { g.S = L.startS; g.hist = [{ m: startMin, S: g.S }]; }
    if (L.noOrders) g.nextOrderIn = Infinity;
    if (L.setup) L.setup(g);                 // 第 6–9 关：建立“全体做市商账本”
    if (L.seed) L.seed(g);
    g.pendingFlow = 0;                       // 开局对冲不推动股价
    const gk = Core.greeks(g);
    g.gamma0 = Math.abs(gk.gamma);
    g.gHist.push({ m: g.minutes, g: gk.gamma });
    Core.track(g);
    return g;
  },

  // 组合希腊值：delta / gamma 以“股”为单位，theta 以“每步美元”为单位，value 为持仓市值
  greeks(g, S = g.S, minutes = g.minutes) {
    const T = P.years(minutes), v = g.set.iv;
    let delta = 0, gamma = 0, theta = 0, value = 0;
    for (const k in g.pos) {
      const p = g.pos[k];
      if (p.type === 'S') { delta += p.qty; value += p.qty * S; continue; }
      const n = p.qty * MULT;
      delta += P.delta(p.type, S, p.K, T, v) * n;
      gamma += P.gamma(p.type, S, p.K, T, v) * n;
      theta += P.theta(p.type, S, p.K, T, v) * n / P.MIN_PER_YEAR;
      value += P.price(p.type, S, p.K, T, v) * n;
    }
    return { delta, gamma, theta, value };
  },
  theo(g, type, K, S = g.S) { return P.price(type, S, K, P.years(g.minutes), g.set.iv); },
  total(g) { return g.cash + Core.greeks(g).value; },
  track(g) {
    const gk = Core.greeks(g);
    g.thetaPeak = Math.max(g.thetaPeak, gk.theta);
    g.gammaPeak = Math.max(g.gammaPeak, Math.abs(gk.gamma));
  },

  // 一笔成交。qty 以“我”的角度：正 = 我买入，负 = 我卖出
  trade(g, t) {
    const isStk = t.type === 'S';
    const mult = isStk ? 1 : MULT;
    const key = isStk ? 'STK' : t.type + t.K;
    g.cash -= t.qty * t.price * mult;
    const edge = (t.theo - t.price) * t.qty * mult;
    if (t.kind === 'client') g.pnl.spread += edge;
    else if (t.kind !== 'settle') g.pnl.hedge += edge;

    let p = g.pos[key];
    if (!p) p = g.pos[key] = { type: t.type, K: t.K || 0, qty: 0, avg: 0 };
    const prevAvg = p.avg;
    let realized = 0;
    if (p.qty !== 0 && Math.sign(p.qty) !== Math.sign(t.qty)) {
      const closeQty = Math.min(Math.abs(t.qty), Math.abs(p.qty));
      realized = (t.price - p.avg) * closeQty * Math.sign(p.qty) * mult;
      const rem = Math.abs(t.qty) - closeQty;
      p.qty += Math.sign(t.qty) * closeQty;
      if (rem > 0) { p.qty = Math.sign(t.qty) * rem; p.avg = t.price; }
    } else {
      const nq = Math.abs(p.qty) + Math.abs(t.qty);
      p.avg = (p.avg * Math.abs(p.qty) + t.price * Math.abs(t.qty)) / nq;
      p.qty += t.qty;
    }
    if (p.qty === 0) delete g.pos[key];

    // 交易记录文字
    const q = Math.abs(t.qty), buy = t.qty > 0;
    let text, flag = null;
    if (isStk) {
      g.pendingFlow += t.qty;
      g.volume += q;
      text = `${t.why}：在 ${fmt.px(t.price)} ${buy ? '买入' : '卖出'} ${fmt.int(q)} 股`;
      // 卖出时对比之前的买入均价；买入（买回之前卖空的股票）时对比之前的卖出均价
      const before = buy ? `之前卖出均价 ${fmt.px(prevAvg)}，现在买回 ${fmt.px(t.price)}` : `之前买入均价 ${fmt.px(prevAvg)}，现在卖出 ${fmt.px(t.price)}`;
      if (realized < -0.005) {
        g.stockLoss += realized;
        flag = { kind: 'bad', amount: realized, text: `高买低卖：${before}，亏 ${fmt.money(realized)}` };
      } else if (realized > 0.005) {
        g.stockGain += realized;
        flag = { kind: 'good', amount: realized, text: `低买高卖：${before}，赚 ${fmt.money(realized)}` };
      }
      if (t.react && !g.clientSinceMove && g.lastDS !== 0) {
        const up = g.lastDS > 0;
        g.pattern[(up ? 'up' : 'down') + (buy ? 'Buy' : 'Sell')]++;
      }
    } else {
      const inst = `${t.K} ${TYPE_NAME[t.type]}`;
      if (t.kind === 'client') {
        text = `${t.why ? t.why + '：' : ''}客户${buy ? '卖出' : '买入'} ${q} 张 ${inst}，你按${buy ? '买价' : '卖价'} ${fmt.px(t.price)} ${buy ? '买入' : '卖出'}（理论价 ${fmt.px(t.theo)}，报价差收入 ${fmt.money(edge)}）`;
      } else if (t.kind === 'market') {
        text = t.why;
      } else if (t.kind === 'settle') {
        const itm = t.price > 0;
        text = `到期结算：${inst} ${itm ? `价内，内在价值 ${fmt.px(t.price)}` : '价外，归零'}，${fmt.sint(-t.qty)} 张 → 现金 ${fmt.money(-t.qty * t.price * mult)}`;
      } else {
        text = `${t.why}：向其他做市商${buy ? '买入' : '卖出'} ${q} 张 ${inst}，成交价 ${fmt.px(t.price)}（理论价 ${fmt.px(t.theo)}，对冲成本 ${fmt.money(edge)}）`;
      }
    }
    Core.log(g, text, flag, { kind: isStk ? 'stock' : t.kind, qty: t.qty, price: t.price, type: t.type, K: t.K });
    Core.track(g);
  },
  log(g, text, flag, meta) {
    g.trades.unshift({ seq: ++g.logSeq, step: g.step, m: g.minutes, text, flag, ...(meta || {}) });
    if (g.trades.length > 400) g.trades.length = 400;
  },

  stockTrade(g, qty, kind, why, react) {
    qty = Math.round(qty);
    if (!qty) return 0;
    const half = g.set.stockHalf;
    Core.trade(g, { type: 'S', qty, price: g.S + Math.sign(qty) * half, theo: g.S, kind, why, react });
    return qty;
  },
  optionTrade(g, type, K, qty, why) {
    qty = Math.round(qty);
    if (!qty) return;
    const theo = Core.theo(g, type, K);
    Core.trade(g, { type, K, qty, price: theo + Math.sign(qty) * g.set.mmSpread / 2, theo, kind: 'hedge', why });
  },
  // 客户订单成交：客户买 = 我按卖价卖出；type 'X' = 跨式（Call 和 Put 各一份）
  clientFill(g, o, why) {
    const legs = o.type === 'X' ? ['C', 'P'] : [o.type];
    const myQty = o.side === 'buy' ? -o.qty : o.qty;
    for (const type of legs) {
      const theo = Core.theo(g, type, o.K);
      Core.trade(g, { type, K: o.K, qty: myQty, price: theo - Math.sign(myQty) * g.set.clientSpread / 2, theo, kind: 'client', why });
    }
    g.clientSinceMove = true;
  },
  autoHedge(g, why = '自动对冲 Delta', react = false) {
    return Core.stockTrade(g, -Core.greeks(g).delta, 'auto', why, react);
  },

  // 股价/时间变化，并做盈亏归因
  move(g, newS, newMinutes) {
    g.lastImpact = 0;
    const b = Core.greeks(g);
    const dS = newS - g.S, dt = g.minutes - newMinutes;
    g.S = newS; g.minutes = newMinutes;
    const a = Core.greeks(g);
    g.pnl.delta += b.delta * dS;
    g.pnl.gamma += 0.5 * b.gamma * dS * dS;
    g.pnl.theta += b.theta * dt;
    if (dS !== 0) { g.lastDS = dS; g.clientSinceMove = false; }
    g.hist.push({ m: newMinutes, S: newS });
    if (g.hist.length > 4000) g.hist.shift();
    g.lastMove = { dS, dt, deltaBefore: b.delta, deltaAfter: a.delta, pnl: a.value - b.value };
    return g.lastMove;
  },
  preview(g, d) {
    const b = Core.greeks(g), a = Core.greeks(g, g.S + d);
    return { S: g.S + d, delta: a.delta, need: -a.delta, pnl: a.value - b.value };
  },
  // 手动拖动股价（不走时间）；d 为 ±1 时记录“预览 vs 实际”
  nudge(g, d) {
    const pre = Math.abs(Math.abs(d) - 1) < 1e-9 ? Core.preview(g, d) : null;
    const m = Core.move(g, Math.max(1, g.S + d), g.minutes);
    g.lastCheck = pre ? { d, pre, act: { delta: m.deltaAfter, pnl: m.pnl } } : null;
    return m;
  },
  news(g, dir, size) {
    const pct = (size || 0.005 + Math.random() * 0.005) * (dir || (Math.random() < 0.5 ? -1 : 1));
    const d = g.S * pct;
    const m = Core.move(g, g.S + d, g.minutes);
    g.lastCheck = null;
    Core.log(g, `突发新闻：股价跳空 ${d > 0 ? '+' : '−'}${fmt.px(Math.abs(d))}（${(pct * 100).toFixed(2)}%），持仓市值变化 ${fmt.money(m.pnl)}`, null);
  },

  // 一步 = 1 分钟。返回 'order'（来单）或 'expired'（到期）或 null
  step(g) {
    if (g.ended) return null;
    const L = LEVELS[g.level];
    let dS = 0;
    if (g.mode === 'auto') {
      const v = g.set.iv, dt = 1 / P.MIN_PER_YEAR;
      dS = g.S * (Math.exp(v * Math.sqrt(dt) * rnd.gauss() - 0.5 * v * v * dt) - 1);
      const pull = g.set.pull[g.level];
      if (pull) dS += pull * (PIN - g.S);
      if (L.drift) dS += typeof L.drift === 'function' ? L.drift(g) : L.drift;   // 第 8、9 关：缓慢漂移
    }
    const k = L.impact ? (L.gex ? g.set.gexImpact : g.set.impact) / 1000 : 0;
    const target = g.S + dS + k * g.pendingFlow;       // 随机冲击 + 上一步之后做市商已经成交的净买入
    // 开着自动对冲时，本步的对冲买卖和它推动的股价同时发生：解出两者一致的价格
    const newS = k > 0 && g.autoHedge ? Core.solveImpact(g, target, k) : target;
    g.pendingFlow = 0;
    const oldS = g.S;
    Core.move(g, Math.max(1, newS), g.minutes - 1);
    g.lastImpact = g.S - oldS - dS;           // 本步对冲推动了多少
    g.dsHist.push(g.S - oldS);
    if (g.dsHist.length > 400) g.dsHist.shift();
    g.lastCheck = null;
    g.step++;
    const dist = Math.abs(g.S - PIN);
    g.sumDist += dist; g.maxDist = Math.max(g.maxDist, dist);

    if (g.minutes <= 0) { Core.settle(g); return 'expired'; }
    if (g.autoHedge) {
      Core.autoHedge(g, '自动对冲 Delta', true);
      if (k > 0) g.pendingFlow = 0;                     // 这笔对冲的冲击已经算进本步股价
    }
    if (L.afterStep) L.afterStep(g);
    g.gHist.push({ m: g.minutes, g: Core.greeks(g).gamma });
    Core.track(g);

    if (g.order) {
      g.order.ttl--;
      if (g.order.ttl <= 0) {
        Core.log(g, '客户等不及，撤单了', null);
        Core.noteOrder(g, g.order, '撤单');
        g.order = null; g.nextOrderIn = rnd.int(...L.orderGap);
      }
    } else if (--g.nextOrderIn <= 0) {
      g.order = Core.makeOrder(g);
      return 'order';
    }
    return null;
  },
  // 第 5 关：找价格 x，使 x = target + k × 对冲净买入(x)，其中对冲净买入(x) = −(x 处的整体涨跌效果)。
  // 做多 Gamma 时只有一个解（股价被压住）；做空 Gamma 且 k×|Gamma| > 1 时，沿冲击方向找到最近的解，
  // 价格会一口气跳过去，直到离开 Gamma 大的区域（Gamma squeeze）。
  solveImpact(g, target, k) {
    const m = g.minutes - 1;
    const h = x => x - target + k * Core.greeks(g, x, m).delta;
    const dir = h(g.S) < 0 ? 1 : -1;
    let a = g.S, ha = h(a), b = a;
    for (let i = 0; i < 4000; i++) {
      b = a + dir * 0.02;
      const hb = h(b);
      if (Math.sign(hb) !== Math.sign(ha) || hb === 0) break;
      a = b; ha = hb;
    }
    for (let i = 0; i < 40; i++) {
      const mid = (a + b) / 2, hm = h(mid);
      if (Math.sign(hm) === Math.sign(ha)) { a = mid; ha = hm; } else b = mid;
    }
    // 一分钟内对冲推动的价格最多 IMPACT_CAP 元：squeeze 会分几步走完，而不是一步跳到底
    const x = (a + b) / 2;
    return target + Math.max(-IMPACT_CAP, Math.min(IMPACT_CAP, x - target));
  },
  makeOrder(g) {
    const L = LEVELS[g.level];
    const pBuy = { buy: 0.85, sell: 0.15, mixed: 0.5 }[g.bias];
    return {
      id: ++g.orderSeq,
      side: Math.random() < pBuy ? 'buy' : 'sell',
      type: rnd.pick(L.types),
      K: rnd.weighted(L.weights),
      qty: rnd.pick(L.qtys) * L.scale,
      ttl: 10
    };
  },
  acceptOrder(g) {
    const o = g.order; if (!o) return;
    Core.clientFill(g, o, '');
    if (g.autoHedge) Core.autoHedge(g, '接单后自动对冲 Delta');
    Core.noteOrder(g, o, '已接单');
    g.order = null; g.nextOrderIn = rnd.int(...LEVELS[g.level].orderGap);
  },
  rejectOrder(g) {
    if (!g.order) return;
    Core.log(g, '拒绝了客户订单（没有收益，也不增加风险）', null);
    Core.noteOrder(g, g.order, '已拒绝');
    g.order = null; g.nextOrderIn = rnd.int(...LEVELS[g.level].orderGap);
  },
  noteOrder(g, o, result) {
    g.recentOrders.unshift({ text: orderTitle(o), result, step: g.step });
    if (g.recentOrders.length > 4) g.recentOrders.length = 4;
  },
  settle(g) {
    for (const k of Object.keys(g.pos)) {
      const p = g.pos[k];
      if (p.type === 'S') continue;
      const iv = P.intrinsic(p.type, g.S, p.K);
      Core.trade(g, { type: p.type, K: p.K, qty: -p.qty, price: iv, theo: iv, kind: 'settle' });
    }
    Core.log(g, `到期：股票按收盘价 ${fmt.px(g.S)} 计值`, null);
    g.order = null; g.ended = true; g.endReason = 'expiry';
  },
  breakdown(g) {
    const total = Core.total(g);
    const p = g.pnl;
    const parts = p.spread + p.hedge + p.gamma + p.theta + p.delta;
    return { total, parts, other: total - parts, ...p };
  }
};

/* =====================================================================
 * 5. GEX：全体做市商在每个行权价上，股价每动 1 块要被迫买卖多少股
 * ===================================================================== */
const GEX = {
  // 站位符号：+1 = 做市商是买方（做多 Gamma），−1 = 卖方（做空 Gamma）
  sign(cell, stance) {
    if (cell.side === 'buy') return 1;
    if (cell.side === 'sell') return -1;
    if (cell.type === 'P') return -1;                 // 默认：机构买 Put 当保险 → 做市商卖 Put
    return stance === 'retail' ? -1 : 1;              // 默认：机构卖 Call 收租 → 做市商买 Call；散户狂买 Call → 做市商卖
  },
  // 单格 GEX（股/每 1 元）= 符号 × Gamma × 100 × 未平仓张数
  value(sign, gamma, oi) { return sign * gamma * MULT * oi; },
  minutesOf(cell, ctx) { return cell.minutes != null ? cell.minutes - (ctx.elapsed || 0) : ctx.minutes; },
  gammaOf(cell, S, ctx) {
    const m = GEX.minutesOf(cell, ctx);
    return m > 0 ? P.gamma(cell.type, S, cell.K, P.years(m), cell.iv || ctx.iv) : 0;
  },
  cellGex(cell, S, ctx) { return GEX.value(GEX.sign(cell, ctx.stance), GEX.gammaOf(cell, S, ctx), cell.oi); },
  total(cells, S, ctx) { let t = 0; for (const c of cells) t += GEX.cellGex(c, S, ctx); return t; },
  compute(cells, S, ctx) {
    const map = new Map();
    let total = 0;
    for (const c of cells) {
      const v = GEX.cellGex(c, S, ctx);
      if (!map.has(c.K)) map.set(c.K, { K: c.K, call: 0, put: 0, net: 0, callOi: 0, putOi: 0 });
      const r = map.get(c.K);
      if (c.type === 'C') { r.call += v; r.callOi += c.oi; } else { r.put += v; r.putOi += c.oi; }
      r.net += v; total += v;
    }
    const rows = [...map.values()].sort((a, b) => a.K - b.K);
    let cw = null, pw = null;
    for (const r of rows) {
      if (r.callOi > 0 && (!cw || Math.abs(r.call) > Math.abs(cw.call))) cw = r;
      if (r.putOi > 0 && (!pw || Math.abs(r.put) > Math.abs(pw.put))) pw = r;
    }
    return {
      rows, total,
      callWall: cw ? cw.K : null, callWallShort: cw ? cw.call < 0 : false,
      putWall: pw ? pw.K : null, putWallLong: pw ? pw.put > 0 : false
    };
  },
  // 股价从 S 动 d 元，全体做市商为回到 0 要买（+）或卖（−）多少股：完整重新定价
  hedgeOnMove(cells, S, d, ctx) {
    let ch = 0;
    for (const c of cells) {
      const m = GEX.minutesOf(c, ctx);
      if (m <= 0) continue;
      const T = P.years(m), v = c.iv || ctx.iv, sg = GEX.sign(c, ctx.stance);
      ch += sg * (P.delta(c.type, S + d, c.K, T, v) - P.delta(c.type, S, c.K, T, v)) * MULT * c.oi;
    }
    return -ch;
  },
  // 在 [lo, hi] 里以 step 为步长重算总 GEX，返回所有正负翻转点（线性插值）
  crossings(cells, lo, hi, ctx, step = 0.1) {
    const out = [];
    const n = Math.round((hi - lo) / step);
    let px = lo, pv = GEX.total(cells, lo, ctx);
    for (let i = 1; i <= n; i++) {
      const x = lo + i * step, v = GEX.total(cells, x, ctx);
      if ((pv > 0 && v <= 0) || (pv < 0 && v >= 0)) out.push(px + (x - px) * (pv / (pv - v)));
      px = x; pv = v;
    }
    return out;
  },
  // Gamma Flip：当前价 ±5% 内、离当前价最近的翻转点；没有则返回 null
  flip(cells, S, ctx) {
    const xs = GEX.crossings(cells, S * 0.95, S * 1.05, ctx);
    let best = null;
    for (const x of xs) if (best === null || Math.abs(x - S) < Math.abs(best - S)) best = x;
    return best;
  },
  nearest(xs, S) {
    let best = null;
    for (const x of xs) if (Math.abs(x - S) <= S * 0.05 && (best === null || Math.abs(x - S) < Math.abs(best - S))) best = x;
    return best;
  },
  // 把“市场持仓 × 站位”换成 Core 能用的账本（全体做市商），单位：张
  toBook(cells, stance) {
    const pos = {};
    for (const c of cells) {
      const key = c.type + c.K;
      if (!pos[key]) pos[key] = { type: c.type, K: c.K, qty: 0, avg: 0 };
      pos[key].qty += GEX.sign(c, stance) * c.oi;
    }
    for (const k in pos) if (pos[k].qty === 0) delete pos[k];
    return pos;
  }
};

function gexRealCells(g) { return g.showHidden ? g.market.cells.concat(g.market.hidden) : g.market.cells; }
function gexSetup(g) {
  const L = LEVELS[g.level], pr = PRESETS[L.preset];
  g.market = {
    cells: pr.cells.map(c => ({ ...c })), hidden: (pr.hidden || []).map(c => ({ ...c })),
    stance: L.biasToggle ? g.bias : pr.stance
  };
  g.showHidden = !!g.opts.hidden;
  g.cashIn = g.opts.cashIn != null ? g.opts.cashIn : 0.1;
  g.pos = GEX.toBook(gexRealCells(g), g.market.stance);
  Core.autoHedge(g, '开局：全体做市商把涨跌效果对冲到 0');
  g.gx = { calmN: 0, calmSum: 0, wildN: 0, wildSum: 0, maxS: g.S, minS: g.S, aboveCW: 0, nearCW: 0, nearPW: 0, cashed: 0, state: null, crossings: 0 };
}
function gexView(g) {
  const key = [g.step, g.S.toFixed(4), g.minutes, g.set.iv, g.market.stance, g.showHidden, g.market.cells.map(c => c.oi).join(',')].join('|');
  if (g._gv && g._gv.key === key) return g._gv;
  const ctx = { stance: g.market.stance, iv: g.set.iv, minutes: g.minutes };
  const v = GEX.compute(g.market.cells, g.S, ctx);
  v.flip = GEX.flip(g.market.cells, g.S, ctx);
  v.realTotal = g.showHidden ? GEX.total(gexRealCells(g), g.S, ctx) : v.total;
  v.realFlip = g.showHidden ? GEX.flip(gexRealCells(g), g.S, ctx) : v.flip;
  v.move = GEX.hedgeOnMove(g.market.cells, g.S, 1, ctx);
  v.key = key;
  Object.defineProperty(g, '_gv', { value: v, writable: true, configurable: true, enumerable: false });
  return v;
}
function gexAfterStep(g) {
  const L = LEVELS[g.level], v = gexView(g), x = g.gx;
  const dS = g.dsHist[g.dsHist.length - 1] || 0;
  const calm = v.realTotal >= 0;
  if (calm) { x.calmN++; x.calmSum += Math.abs(dS); } else { x.wildN++; x.wildSum += Math.abs(dS); }
  x.maxS = Math.max(x.maxS, g.S); x.minS = Math.min(x.minS, g.S);
  if (v.callWall && g.S >= v.callWall) x.aboveCW++;
  if (v.callWall && Math.abs(g.S - v.callWall) <= 0.5) x.nearCW++;
  if (v.putWall && Math.abs(g.S - v.putWall) <= 0.5) x.nearPW++;
  const st = calm ? 'calm' : 'wild';
  if (x.state && st !== x.state) {
    x.crossings++;
    Core.log(g, st === 'wild'
      ? `股价来到 ${fmt.px(g.S)}：总 GEX 由正变负（越过了 Gamma Flip），做市商开始顺着涨跌买卖，波动会变大`
      : `股价来到 ${fmt.px(g.S)}：总 GEX 由负变正（回到 Gamma Flip 另一边），做市商重新逆着涨跌买卖，波动会变小`, null, { kind: 'event' });
  }
  x.state = st;
  // 第 7 关：价格进入 Put Wall ±0.5 元时，买保险的人按比例兑现
  if (L.cashIn && g.cashIn > 0 && v.putWall && Math.abs(g.S - v.putWall) <= 0.5) {
    const cell = g.market.cells.find(c => c.K === v.putWall && c.type === 'P');
    const q = cell ? Math.round(cell.oi * g.cashIn) : 0;
    if (q >= 100 && GEX.sign(cell, g.market.stance) < 0) {
      cell.oi -= q;
      const theo = Core.theo(g, 'P', cell.K);
      Core.trade(g, {
        type: 'P', K: cell.K, qty: q, price: theo, theo, kind: 'market',
        why: `股价来到 Put Wall ${cell.K} 附近：买保险的人兑现了 ${Math.round(g.cashIn * 100)}% 的 ${cell.K} Put（${fmt.int(q)} 张），做市商从他们手里买回这些 Put`
      });
      Core.autoHedge(g, '做市商买回 Put 后，原来为这些 Put 做空的对冲股票多出来了，把它们买回');
      x.cashed += q;
    }
  }
}

const CSV = {
  // 美东时区偏移（分钟）：夏令时 −240，冬令时 −300
  etOffset(utcMs) {
    const y = new Date(utcMs).getUTCFullYear();
    const mar = new Date(Date.UTC(y, 2, 1)).getUTCDay(), nov = new Date(Date.UTC(y, 10, 1)).getUTCDay();
    const start = Date.UTC(y, 2, 1 + ((7 - mar) % 7) + 7, 7);      // 3 月第二个周日 2:00（美东）
    const end = Date.UTC(y, 10, 1 + ((7 - nov) % 7), 6);           // 11 月第一个周日 2:00（美东）
    return utcMs >= start && utcMs < end ? -240 : -300;
  },
  parseAsof(s) {
    s = String(s || '').trim().replace(' ', 'T').replace(/([+-]\d{2})(\d{2})$/, '$1:$2');
    if (!s) return NaN;
    if (/([zZ]|[+-]\d{2}:\d{2})$/.test(s)) return Date.parse(s);
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})T(\d{1,2}):(\d{2})/);
    if (!m) return NaN;
    const local = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    return local - CSV.etOffset(local + 5 * 3600000) * 60000;     // 没写时区的按美东时间理解
  },
  expiryClose(dateStr) {                                            // 到期日 16:00 美东
    const [y, mo, d] = dateStr.split('-').map(Number);
    const day = Date.UTC(y, mo - 1, d);
    return day + (16 * 60 - CSV.etOffset(day + 17 * 3600000)) * 60000;
  },
  // 两个时刻之间的交易分钟数（周一到周五 9:30–16:00 美东，不扣节假日）
  tradingMinutes(fromMs, toMs) {
    if (!(toMs > fromMs)) return 0;
    const off0 = CSV.etOffset(fromMs), loc = new Date(fromMs + off0 * 60000);
    let day = Date.UTC(loc.getUTCFullYear(), loc.getUTCMonth(), loc.getUTCDate()), total = 0;
    for (let i = 0; i < 5000 && day <= toMs + 86400000; i++, day += 86400000) {
      const dow = new Date(day).getUTCDay();
      if (dow === 0 || dow === 6) continue;
      const off = CSV.etOffset(day + 17 * 3600000);
      const open = day + (9 * 60 + 30 - off) * 60000, close = day + (16 * 60 - off) * 60000;
      const a = Math.max(open, fromMs), b = Math.min(close, toMs);
      if (b > a) total += (b - a) / 60000;
    }
    return Math.round(total);
  },
  ALIAS: {
    expiration: ['expiration', 'expiry', 'exp', 'expiration_date', 'expirationdate', 'expdate'],
    strike: ['strike', 'strike_price', 'strikeprice', 'k'],
    type: ['type', 'option_type', 'optiontype', 'cp', 'right', 'put_call', 'call_put', 'callput'],
    oi: ['open_interest', 'openinterest', 'oi'],
    iv: ['iv', 'implied_volatility', 'impliedvolatility', 'impl_vol']
  },
  parse(text, opts = {}) {
    const out = { rows: [], errors: [], warnings: [], meta: {} };
    let header = null, idx = null, missingIv = false, pctIv = false;
    String(text || '').split(/\r?\n/).forEach((raw, i) => {
      const ln = i + 1, line = raw.trim();
      if (!line) return;
      const bad = msg => out.errors.push({ line: ln, msg });
      if (line.startsWith('#')) {
        line.slice(1).split(/[,;]\s*(?=[A-Za-z_]+\s*=)/).forEach(kv => {
          const m = kv.match(/^\s*([A-Za-z_]+)\s*=\s*(.+?)\s*$/);
          if (!m) return;
          const k = m[1].toLowerCase();
          if (['underlying', 'spot', 'price'].includes(k)) {
            const v = parseFloat(m[2]);
            if (v > 0) out.meta.underlying = v; else bad(`underlying 不是有效价格：“${m[2]}”`);
          } else if (k === 'asof') {
            const t = CSV.parseAsof(m[2]);
            if (isNaN(t)) bad(`asof 时间看不懂：“${m[2]}”，请写成 2026-09-28T15:07-04:00`); else { out.meta.asof = t; out.meta.asofText = m[2]; }
          }
        });
        return;
      }
      const cols = line.split(line.includes('\t') ? '\t' : ',').map(s => s.trim().replace(/^"(.*)"$/, '$1').trim());
      if (!header) {
        header = cols.map(c => c.toLowerCase().replace(/\s+/g, '_'));
        idx = {};
        for (const key in CSV.ALIAS) idx[key] = header.findIndex(h => CSV.ALIAS[key].includes(h));
        if (idx.strike < 0) bad('表头缺少 strike（行权价）列');
        if (idx.type < 0) bad('表头缺少 type（C/P）列');
        if (idx.oi < 0) bad('表头缺少 open_interest（未平仓张数）列');
        if (idx.iv < 0) missingIv = true;
        return;
      }
      if (idx.strike < 0 || idx.type < 0 || idx.oi < 0) return;
      if (cols.length < header.length) return bad(`列数不够：表头有 ${header.length} 列，这一行只有 ${cols.length} 列`);
      const K = Number(cols[idx.strike]);
      if (!(K > 0)) return bad(`strike 应该是正数，实际是“${cols[idx.strike]}”`);
      const t = cols[idx.type].toLowerCase();
      const type = t === 'c' || t === 'call' ? 'C' : t === 'p' || t === 'put' ? 'P' : null;
      if (!type) return bad(`type 应为 C/P 或 call/put，实际是“${cols[idx.type]}”`);
      const oiRaw = cols[idx.oi].replace(/_/g, '');
      const oi = Number(oiRaw);
      if (oiRaw === '' || !(oi >= 0)) return bad(`open_interest 应该是不小于 0 的数，实际是“${cols[idx.oi]}”`);
      let iv = null;
      if (idx.iv >= 0 && cols[idx.iv] !== '') {
        iv = Number(cols[idx.iv]);
        if (!(iv > 0)) return bad(`iv 应该是正数（例如 0.142），实际是“${cols[idx.iv]}”`);
        if (iv > 3) { iv /= 100; pctIv = true; }
      } else missingIv = true;
      let expiry = null;
      if (idx.expiration >= 0) {
        expiry = cols[idx.expiration];
        if (!/^\d{4}-\d{2}-\d{2}$/.test(expiry)) return bad(`expiration 请写成 2026-10-02 这样的日期，实际是“${expiry}”`);
      }
      out.rows.push({ expiry, K, type, oi, iv, line: ln });
    });
    if (!header) out.errors.push({ line: 0, msg: '没有找到表头行，例如：expiration,strike,type,open_interest,iv' });
    if (missingIv && out.rows.length) out.warnings.push(`未提供隐含波动率，按 ${Math.round((opts.iv || 0.15) * 100)}% 计算`);
    if (pctIv) out.warnings.push('有的 iv 大于 3，已按百分数理解（例如 14.2 → 14.2%）');
    return out;
  }
};

function runSelfTests() {

    const T = P.years(m);
    worst = Math.max(worst, Math.abs(P.price('C', S, K, T, v) - P.price('P', S, K, T, v) - (S - K)));
  }
  ok('put-call parity：C − P = S − K', worst < 1e-9, `最大误差 ${worst.toExponential(2)}`);

  let gd = 0, dd = 0;
  for (const S of [755, 767, 779]) for (const K of STRIKES) {
    const T = P.years(120);
    gd = Math.max(gd, Math.abs(P.gamma('C', S, K, T, v) - P.gamma('P', S, K, T, v)));
    dd = Math.max(dd, Math.abs(P.delta('C', S, K, T, v) - P.delta('P', S, K, T, v) - 1));
  }
  ok('Call 与 Put 的 Gamma 相同', gd < 1e-12, `最大差 ${gd.toExponential(2)}`);
  ok('Call Delta − Put Delta = 1', dd < 1e-12, `最大误差 ${dd.toExponential(2)}`);

  let fdD = 0, fdG = 0, fdT = 0;
  for (const type of ['C', 'P']) for (const S of [758, 767, 776]) for (const K of STRIKES) for (const m of [30, 390]) {
    const T = P.years(m), h = 0.01, hg = 0.05, dT = P.years(0.01);
    const f = s => P.price(type, s, K, T, v);
    const dNum = (f(S + h) - f(S - h)) / (2 * h);
    const gNum = (f(S + hg) - 2 * f(S) + f(S - hg)) / (hg * hg);
    const tNum = -(P.price(type, S, K, T + dT, v) - P.price(type, S, K, T - dT, v)) / (2 * dT);
    const gA = P.gamma(type, S, K, T, v), tA = P.theta(type, S, K, T, v);
    fdD = Math.max(fdD, Math.abs(dNum - P.delta(type, S, K, T, v)));
    fdG = Math.max(fdG, Math.abs(gNum - gA) / Math.max(gA, 1e-3));
    fdT = Math.max(fdT, Math.abs(tNum - tA) / Math.max(Math.abs(tA), 1));
  }
  ok('有限差分 Delta ≈ 解析 Delta', fdD < 1e-5, `最大绝对误差 ${fdD.toExponential(2)}`);
  ok('有限差分 Gamma ≈ 解析 Gamma', fdG < 2e-3, `最大相对误差 ${fdG.toExponential(2)}`);
  ok('有限差分 Theta ≈ 解析 Theta', fdT < 2e-3, `最大相对误差 ${fdT.toExponential(2)}`);

  // 场景：卖出 100 张 767 Call，Delta 恰为 0.50
  const set = makeSettings(); set.stockHalf = 0; set.clientSpread = 0;
  const g = Core.newGame(1, set);
  g.S = 767 * Math.exp(-0.5 * v * v * P.years(g.minutes));       // d1 = 0 → Delta = 0.50
  const d0 = P.delta('C', g.S, 767, P.years(g.minutes), v);
  Core.clientFill(g, { side: 'buy', type: 'C', K: 767, qty: 100 }, '自检');
  const txt = deltaText(Core.greeks(g).delta);
  ok('场景：卖出 100 张 767 Call（Delta 0.50）→ 仪表显示“相当于做空 5,000 股”', txt === '相当于做空 5,000 股', `Delta=${d0.toFixed(4)}，仪表文字“${txt}”`);
  const pre = Core.preview(g, 1);
  Core.nudge(g, 1);
  const c = g.lastCheck;
  const same = Math.abs(c.act.delta - pre.delta) < 1e-6 && Math.abs(c.act.pnl - pre.pnl) < 1e-6;
  ok('场景：股价 +1 后，幽灵指针的预测 = 实际变化', same,
    `预测 ${deltaText(pre.delta)}、${fmt.money(pre.pnl)}；实际 ${deltaText(c.act.delta)}、${fmt.money(c.act.pnl)}`);

  // 盈亏归因：随机走 300 步并自动对冲，各项之和 ≈ 总盈亏

function makeLab(key, opts = {}) {
  const pr = PRESETS[key];
  return {
    preset: key, cells: pr.cells.map(c => ({ ...c })), hidden: (pr.hidden || []).map(c => ({ ...c })),
    S: pr.S, S0: pr.S, minutes: pr.minutes, iv: SET.iv, stance: pr.stance, showHidden: false,
    imported: null, expiryFilter: 'all', elapsed: 0, selected: null, readOnly: !!opts.readOnly, version: 1, lockPrice: false
  };
}
function labCtx(st) { return { stance: st.stance, iv: st.iv, minutes: st.minutes, elapsed: st.elapsed || 0 }; }
function labCells(st) { return st.expiryFilter !== 'all' ? st.cells.filter(c => c.expiry === st.expiryFilter) : st.cells; }

  const ks = labCells(st).map(c => c.K);

  const lo = Math.max(st.S * 0.93, Math.min(st.S * 0.97, minK - 3));

}
// 总 GEX 曲线与翻转点：只在分布、时间、波动率、站位变化时重算（与当前股价无关）
function labCurve(st, lo, hi, npts) {
  const key = [st.version, st.stance, st.iv, st.minutes, st.elapsed, st.expiryFilter, st.showHidden, lo.toFixed(1), hi.toFixed(1), npts].join('|');
  if (st._curve && st._curve.key === key) return st._curve;
  const ctx = labCtx(st), cells = labCells(st), real = labRealCells(st);
  const pts = [];
  for (let i = 0; i <= npts; i++) {
    const x = lo + (hi - lo) * i / npts;
    pts.push({ x, v: GEX.total(cells, x, ctx), real: st.showHidden ? GEX.total(real, x, ctx) : null });
  }
  const c = { key, pts, cross: GEX.crossings(cells, lo, hi, ctx), crossReal: st.showHidden ? GEX.crossings(real, lo, hi, ctx) : [] };
  Object.defineProperty(st, '_curve', { value: c, writable: true, configurable: true, enumerable: false });
  return c;
}

  const ctx = labCtx(st), cells = labCells(st);

  const res = GEX.compute(cells, st.S, ctx);
  const cur = labCurve(st, lo, hi, 160);
  res.flip = GEX.nearest(cur.cross, st.S);
  res.realTotal = st.showHidden ? GEX.total(labRealCells(st), st.S, ctx) : res.total;
  res.realFlip = st.showHidden ? GEX.nearest(cur.crossReal, st.S) : res.flip;
  res.move = GEX.hedgeOnMove(cells, st.S, 1, ctx);
  res.lo = lo; res.hi = hi; res.curve = cur;

}

/* ---------- 数字动画 ---------- */
function tween(el, to, f) {
  const from = el._v == null ? to : el._v;
  el._v = to;
  cancelAnimationFrame(el._raf);
  if (reduced() || from === to) { el.textContent = f(to); return; }
  const t0 = performance.now(), dur = 300;
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = f(from + (to - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

  const pad = { l: 42, r: gexOn ? Math.min(150, Math.max(90, w * 0.24)) : 78, t: 12, b: 20 };
  const plotR = w - pad.r;
  const X = i => pad.l + (pts.length < 2 ? 1 : i / (pts.length - 1)) * (plotR - pad.l - 18);
  const Y = s => pad.t + (hi - s) / (hi - lo) * (h - pad.t - pad.b);
  ctx.font = '' + fpx(11) + 'px ' + tk.font;
  ctx.textBaseline = 'middle';
  const strikes = gexOn ? gv.rows.map(x => x.K) : STRIKES;

    if (k < lo || k > hi) continue;

    ctx.strokeStyle = k === PIN ? tk.muted : tk.line; ctx.lineWidth = k === PIN ? 1.6 : 1;
    ctx.moveTo(pad.l, Y(k)); ctx.lineTo(w - 4, Y(k)); ctx.stroke();
    ctx.fillStyle = tk.muted; ctx.textAlign = 'right'; ctx.font = (k === PIN ? '700 ' : '') + '' + fpx(11) + 'px ' + tk.font;
    ctx.fillText(String(k), pad.l - 6, Y(k));

  ctx.setLineDash([]);
  ctx.font = '' + fpx(11) + 'px ' + tk.font;
  if (gexOn) drawGexOverlay(ctx, tk, gv, Y, lo, hi, w, pad);
  // 走势线
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.S)) : ctx.moveTo(X(i), Y(p.S)));
  ctx.strokeStyle = tk.accent; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillText(`剩 ${G.hist.length > 600 ? '…' : G.startMin} 分`, pad.l, h - 4);
  ctx.textAlign = 'right';

}
function drawGexOverlay(ctx, tk, gv, Y, lo, hi, w, pad) {
  const rows = gv.rows.filter(r => r.K >= lo && r.K <= hi);
  const maxAbs = Math.max(1, ...gv.rows.map(r => Math.abs(r.net)));
  const room = pad.r - 46;
  for (const r of rows) {
    const len = Math.abs(r.net) / maxAbs * room, y = Y(r.K);
    ctx.fillStyle = r.net >= 0 ? tk.accent : tk.warn;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(w - 6 - len, y - 4, len, 8);
    ctx.globalAlpha = 1;
    const tag = r.K === gv.callWall ? 'Call Wall' : r.K === gv.putWall ? 'Put Wall' : '';
    if (tag) {
      ctx.fillStyle = tk.ink; ctx.font = '800 ' + fpx(10) + 'px ' + tk.font; ctx.textAlign = 'right';
      ctx.fillText(tag, w - 8 - len - 4, y - 9 < 6 ? y + 12 : y - 9);
    }
  }
  if (gv.flip != null && gv.flip > lo && gv.flip < hi) {
    const y = Y(gv.flip);
    ctx.setLineDash([6, 4]); ctx.strokeStyle = tk.warn; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - 4, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = tk.warn; ctx.font = '800 ' + fpx(10) + 'px ' + tk.font; ctx.textAlign = 'left';
    ctx.fillText(`Gamma Flip ${fmt.px(gv.flip)}`, pad.l + 4, y - 8);
  }
  ctx.font = '' + fpx(11) + 'px ' + tk.font;
}
function drawGammaInset(ctx, tk, w, h, pad) {
  const bw = Math.min(200, w * 0.4), bh = Math.min(90, h * 0.42), bx = pad.l + 6, by = h - pad.b - bh - 6;
  ctx.fillStyle = tk.panel; ctx.globalAlpha = 0.92; ctx.fillRect(bx, by, bw, bh); ctx.globalAlpha = 1;
  ctx.strokeStyle = tk.line; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  const hist = G.gHist.map(p => ({ m: p.m, g: Math.abs(p.g) }));
  const proj = [];
  if (!G.ended && G.minutes > 0) {
    const stride = Math.max(1, Math.ceil(G.minutes / 40));
    for (let m = G.minutes; m >= 1; m -= stride) proj.push({ m, g: Math.abs(Core.greeks(G, G.S, m).gamma) });
    proj.push({ m: 1, g: Math.abs(Core.greeks(G, G.S, 1).gamma) });
  }
  const maxG = Math.max(10, ...hist.map(p => p.g), ...proj.map(p => p.g)) * 1.1;
  const ix = bx + 6, iw = bw - 12, iy = by + 18, ih = bh - 26;
  const X = m => ix + (G.startMin - m) / G.startMin * iw, Yg = g => iy + ih - g / maxG * ih;
  ctx.fillStyle = tk.ink; ctx.font = '800 ' + fpx(10) + 'px ' + tk.font; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Gamma 随时间（股/每元）', bx + 6, by + 9);
  if (proj.length > 1) {
    ctx.beginPath(); ctx.setLineDash([4, 3]);
    proj.forEach((p, i) => i ? ctx.lineTo(X(p.m), Yg(p.g)) : ctx.moveTo(X(p.m), Yg(p.g)));
    ctx.strokeStyle = tk.warn; ctx.lineWidth = 1.4; ctx.stroke(); ctx.setLineDash([]);
  }
  if (hist.length) {
    ctx.beginPath(); hist.forEach((p, i) => i ? ctx.lineTo(X(p.m), Yg(p.g)) : ctx.moveTo(X(p.m), Yg(p.g)));
    ctx.strokeStyle = tk.accent; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = tk.muted; ctx.font = '' + fpx(10) + 'px ' + tk.font; ctx.textAlign = 'right';
  ctx.fillText(fmt.int(maxG / 1.1), bx + bw - 6, by + 9);
}

function niceUp(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
  for (const m of [1, 2, 5, 10]) if (m * p >= x) return m * p;
  return 10 * p;
}

function positionBoardLine(ks) {
  const board = $('board'), line = $('boardLine');
  const rows = [...board.querySelectorAll('.bk')];

  const ys = rows.map(r => r.offsetTop + r.offsetHeight / 2);
  const S = kindOf() === 'gex' ? G.S : G.S;
  let y;
  if (S >= ks[0]) y = ys[0] - Math.min(1, (S - ks[0]) / Math.max(ks[0] - ks[1], 1)) * (ys[1] - ys[0]) * 0.5;
  else if (S <= ks[ks.length - 1]) y = ys[ys.length - 1] + Math.min(1, (ks[ks.length - 1] - S) / Math.max(ks[ks.length - 2] - ks[ks.length - 1], 1)) * (ys[1] - ys[0]) * 0.5;
  else {
    let i = 0; while (i < ks.length - 1 && !(S <= ks[i] && S >= ks[i + 1])) i++;
    y = ys[i] + (ks[i] - S) / (ks[i] - ks[i + 1]) * (ys[i + 1] - ys[i]);
  }
  line.style.top = y + 'px';
  line.firstElementChild.textContent = '股价 ' + fmt.px(S);
  if (board.scrollHeight > board.clientHeight + 2 && Date.now() - (UI.boardTouch || 0) > 4000) board.scrollTop = Math.max(0, y - board.clientHeight / 2);
}

function updateWaterfall(box, b) {
  if (!box.dataset.built) {
    box.innerHTML = PNL_ITEMS.map(it => `<button class="wf-col" data-wf="${it.key}"><div class="wf-plot"><i class="wf-bar"></i><span class="wf-v"></span></div><span class="wf-lab">${it.lab}</span></button>`).join('');
    box.dataset.built = '1';
  }
  let cum = 0;
  const segs = PNL_ITEMS.map(it => {
    if (it.key === 'total') return { it, from: 0, to: b.total, v: b.total };
    const v = b[it.key], s = { it, from: cum, to: cum + v, v };
    cum += v;
    return s;
  });
  let lo = 0, hi = 0;
  for (const s of segs) { lo = Math.min(lo, s.from, s.to); hi = Math.max(hi, s.from, s.to); }
  if (hi - lo < 1) hi = lo + 1;
  const pc = x => (x - lo) / (hi - lo) * 82 + 4;
  box.style.setProperty('--z', pc(0) + '%');
  [...box.children].forEach((col, i) => {
    const s = segs[i], bar = col.querySelector('.wf-bar'), val = col.querySelector('.wf-v');
    const b0 = Math.min(s.from, s.to), b1 = Math.max(s.from, s.to);
    bar.className = 'wf-bar ' + (s.v >= 0 ? 'pos' : 'neg') + (s.it.key === 'total' ? ' tot' : '');
    bar.style.bottom = pc(b0) + '%';
    bar.style.height = Math.max(0.6, pc(b1) - pc(b0)) + '%';
    val.textContent = fmt.moneyShort(s.v);
    val.className = 'wf-v ' + fmt.cls(s.v);
    val.style.bottom = (s.v >= 0 ? Math.min(pc(b1) + 1, 88) : Math.max(pc(b0) - 12, 0)) + '%';
    const lab = col.querySelector('.wf-lab');
    lab.innerHTML = s.it.key === 'gamma' && s.v < -0.5 ? `Gamma<b>高买低卖</b>` : s.it.lab;
  });
}

function hintText() {

  if (G.ended) return ['本关已结束。可以看小结、重新开始，或者去下一关（点顶部的关卡名）。', false];
  if (L.kind === 'gex') {

    if (G.level === 7) return [`股价离 Call Wall ${v.callWall} 还有 ${fmt.px(v.callWall - G.S)} 元，离 Put Wall ${v.putWall} 还有 ${fmt.px(G.S - v.putWall)} 元。用“利好 / 利空”把价格推过去试试。`, false];
    if (G.level === 8) return [`${flipStateText(v.realTotal >= 0, v.flip, G.S)}。${v.flip != null ? `离翻转点 ${fmt.px(Math.abs(G.S - v.flip))} 元。` : ''}看控制台和读数里的波动变化。`, v.realTotal < 0];
    return [`现在的站位：${G.market.stance === 'retail' ? '散户狂买 Call（做市商在 772 卖 Call、做空 Gamma）' : '机构卖 Call（做市商在 772 买 Call、做多 Gamma）'}。股价最高到过 ${fmt.px(G.gx.maxS)}。`, false];
  }
  if (G.order) return ['收件箱里有客户订单：接单赚报价差，但会改变你的指针。', false];
  if (!Object.keys(G.pos).length) return ['按顶部的 ▶ 或单步，等客户来单。', false];
  const far = Math.abs(d) > thr;
  if (G.level === 1) {
    if (far && !G.autoHedge) return [`指针偏到了“${deltaText(d)}”。按仪表下方的“调回 0”，用股票${tradeText(-d)}。`, true];
    return [`指针在 0 附近 ✓。看两根幽灵指针：股价一动，指针会自己往不利的方向跑（${gm < 0 ? '因为你做空 Gamma' : 'Gamma 不为 0'}）。`, false];
  }

    return ['Gamma 和 Delta 都接近 0 ✓。幽灵指针几乎和指针重合：股价动了也不用追着买卖。再看看沙漏里的 Theta 变成了多少。', false];
  }

      ? `你在做空 Gamma。自动对冲已经涨了买 ${pt.upBuy} 次、跌了卖 ${pt.downSell} 次。每分钟收 Theta ${fmt.money(gk.theta)}。`

  }

}

  labchart: () => '<h3>GEX 分布图</h3><p>横轴是股价。每个行权价两根柱子：左 Call、右 Put。柱子高度是这一格的 GEX：全体做市商在这个行权价上，股价每动 1 块要被迫买卖多少股。向上 = 做市商做多 Gamma，向下 = 做空 Gamma。</p><p>黑线是“总 GEX 随股价变化”（右轴）：假设股价在每个位置、其他不变，重算所有格子之和。黑线穿过 0 的地方就是 Gamma Flip（竖虚线）。</p><p>竖线是当前股价，按住它左右拖。按住柱子上下拖可以改未平仓张数，轻点柱子切换做市商是买方还是卖方（第 6 关里只能看、不能改）。</p>',

 * 18. GEX 实验室界面（第 6 关也用它的只读版）

function renderLab(st, mode) {
  const quiz = mode === 'quiz';
  $('labTitle').textContent = quiz ? '第 6 关 · 读懂 GEX 图' : 'GEX 实验室';
  $('labNote').textContent = quiz ? '按住竖线拖股价，点柱子答题' : '拖竖线 = 改股价 · 拖柱子 = 改张数 · 点柱子 = 换站位';
  $('legHidden').hidden = !st.showHidden;
  const v = labView(st);
  st._hide = quiz ? quizHide() : null;
  drawLab(st, v);
  renderLabSide(st, v);
  $('labCtrlTitle').textContent = quiz ? '题目' : '摆弄';
  if (quiz) renderQuiz(st, v); else renderLabCtrl(st);
}
function drawLab(st, v) {
  const r = canvasCtx($('labCanvas')); if (!r) return;
  const { ctx, w, h } = r, tk = tokens();
  const pad = { l: 56, r: 56, t: 30, b: 30 };
  const lo = v.lo, hi = v.hi;
  const X = x => pad.l + (x - lo) / (hi - lo) * (w - pad.l - pad.r);
  const rows = v.rows.filter(rw => rw.K >= lo && rw.K <= hi);
  const drag = st._drag;
  const barMax = (drag && drag.barMax) || Math.max(1, ...rows.map(rw => Math.max(Math.abs(rw.call), Math.abs(rw.put))));
  const cur = v.curve;
  const curveMax = Math.max(1, ...cur.pts.map(p => Math.max(Math.abs(p.v), p.real == null ? 0 : Math.abs(p.real))));
  const y0 = pad.t + (h - pad.t - pad.b) / 2, half = (h - pad.t - pad.b) / 2 * 0.92;
  const Yb = val => y0 - val / barMax * half, Yc = val => y0 - val / curveMax * half;
  ctx.font = '' + fpx(10) + 'px ' + tk.font; ctx.lineWidth = 1;
  for (const f of [-1, -0.5, 0.5, 1]) {
    ctx.strokeStyle = tk.line; ctx.beginPath(); ctx.moveTo(pad.l, y0 - f * half); ctx.lineTo(w - pad.r, y0 - f * half); ctx.stroke();
  }
  ctx.strokeStyle = tk.muted; ctx.beginPath(); ctx.moveTo(pad.l, y0); ctx.lineTo(w - pad.r, y0); ctx.stroke();
  ctx.fillStyle = tk.muted; ctx.textBaseline = 'middle';
  ctx.textAlign = 'right';
  ctx.fillText(fmt.sbig(barMax), pad.l - 5, y0 - half); ctx.fillText('0', pad.l - 5, y0); ctx.fillText(fmt.sbig(-barMax), pad.l - 5, y0 + half);
  ctx.textAlign = 'left';
  ctx.fillText(fmt.sbig(curveMax), w - pad.r + 5, y0 - half); ctx.fillText('0', w - pad.r + 5, y0); ctx.fillText(fmt.sbig(-curveMax), w - pad.r + 5, y0 + half);
  ctx.textAlign = 'left'; ctx.fillText('单格 GEX（股/每元）', 4, 10);
  ctx.textAlign = 'right'; ctx.fillText('总 GEX', w - 4, 10);
  // 柱子：每个行权价左 Call、右 Put
  const ks = rows.map(rw => rw.K);
  let minGap = Infinity;
  for (let i = 1; i < ks.length; i++) minGap = Math.min(minGap, X(ks[i]) - X(ks[i - 1]));
  if (!isFinite(minGap)) minGap = 40;
  const bw = Math.max(3, Math.min(22, minGap * 0.42));
  const hits = [], cells = labCells(st);
  for (const rw of rows) {
    const xc = X(rw.K);
    for (const [type, val, color, x0] of [['C', rw.call, tk.call, xc - bw - 1], ['P', rw.put, tk.put, xc + 1]]) {
      const yv = Yb(val), top = Math.min(y0, yv), hgt = Math.max(1.5, Math.abs(yv - y0));
      ctx.fillStyle = color; ctx.fillRect(x0, top, bw, hgt);
      const mine = cells.filter(c => c.K === rw.K && c.type === type);
      if (mine.some(c => c.side)) { ctx.strokeStyle = tk.ink; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]); ctx.strokeRect(x0 + 0.75, top + 0.75, bw - 1.5, Math.max(0, hgt - 1.5)); ctx.setLineDash([]); }
      if (st.selected && st.selected.K === rw.K && st.selected.type === type) { ctx.strokeStyle = tk.accent; ctx.lineWidth = 2; ctx.strokeRect(x0 - 2, top - 2, bw + 4, hgt + 4); }
      hits.push({ K: rw.K, type, x0, x1: x0 + bw });
    }
  }
  ctx.fillStyle = tk.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = '' + fpx(10) + 'px ' + tk.font;
  let lastX = -1e9;
  for (const k of ks) { const x = X(k); if (x - lastX >= 28) { ctx.fillText(String(k), x, h - pad.b + 14); lastX = x; } }
  // 墙
  const flag = (K, text, color, ty) => {
    ctx.font = '800 ' + fpx(10) + 'px ' + tk.font;
    const half = ctx.measureText(text).width / 2 + 2;
    const x = Math.max(half + 2, Math.min(w - half - 2, X(K)));
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, ty);
    ctx.beginPath(); ctx.moveTo(X(K) - 4, 27); ctx.lineTo(X(K) + 4, 27); ctx.lineTo(X(K), 31); ctx.closePath(); ctx.fill();
  };
  const hide = st._hide || {};
  const close = v.callWall != null && v.putWall != null && Math.abs(X(v.callWall) - X(v.putWall)) < 110;
  if (!hide.cw && v.callWall != null && v.callWall >= lo && v.callWall <= hi) flag(v.callWall, v.callWallShort ? 'Call Wall（这里做市商做空 Gamma，不是天花板）' : 'Call Wall ' + v.callWall, v.callWallShort ? tk.warn : tk.call, 22);
  if (!hide.pw && v.putWall != null && v.putWall >= lo && v.putWall <= hi) flag(v.putWall, 'Put Wall ' + v.putWall, tk.put, close && !hide.cw ? 10 : 22);
  // 总 GEX 曲线（右轴）
  ctx.beginPath(); cur.pts.forEach((p, i) => i ? ctx.lineTo(X(p.x), Yc(p.v)) : ctx.moveTo(X(p.x), Yc(p.v)));
  ctx.strokeStyle = tk.ink; ctx.lineWidth = 2; ctx.stroke();
  if (st.showHidden) {
    ctx.beginPath(); cur.pts.forEach((p, i) => i ? ctx.lineTo(X(p.x), Yc(p.real)) : ctx.moveTo(X(p.x), Yc(p.real)));
    ctx.strokeStyle = tk.warn; ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  }
  const vline = (x, color, label, yLab) => {
    ctx.strokeStyle = color; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(x), pad.t); ctx.lineTo(X(x), h - pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.font = '800 ' + fpx(10) + 'px ' + tk.font; ctx.textAlign = X(x) > w - pad.r - 70 ? 'right' : 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, X(x) + (ctx.textAlign === 'left' ? 4 : -4), yLab);
  };
  if (v.flip != null && !hide.flip) vline(v.flip, tk.warn, `Gamma Flip ${fmt.px(v.flip)}`, h - pad.b - 10);
  if (st.showHidden && v.realFlip != null && (v.flip == null || Math.abs(v.realFlip - v.flip) > 0.05)) vline(v.realFlip, tk.warn, `真实翻转点 ${fmt.px(v.realFlip)}`, h - pad.b - 24);
  // 当前股价竖线（可拖）
  const px = X(st.S);
  ctx.strokeStyle = tk.accent; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(px, pad.t + 4); ctx.lineTo(px, h - pad.b); ctx.stroke();
  ctx.beginPath(); ctx.arc(px, Yc(v.total), 5, 0, Math.PI * 2); ctx.fillStyle = tk.ink; ctx.fill();
  const label = `◀ 股价 ${fmt.px(st.S)} ▶`;
  ctx.font = '800 ' + fpx(11) + 'px ' + tk.font;
  const lw = ctx.measureText(label).width + 14, lx = Math.max(2, Math.min(w - lw - 2, px - lw / 2)), ly = h - pad.b + 3;
  ctx.fillStyle = tk.accent; roundRect(ctx, lx, ly, lw, 22, 8); ctx.fill();
  ctx.fillStyle = tk.panel; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, lx + lw / 2, ly + 11);
  st._layout = { pad, lo, hi, w, h, y0, half, barMax, curveMax, hits, X };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function renderLabSide(st, v) {
  const calm = v.total >= 0, hide = st._hide || {};
  const dollar = Math.abs(v.total) * st.S * 0.01 * st.S;
  let html = `
    <div class="kv"><span>总 GEX（${st.showHidden ? '你看到的' : '这就是全体做市商的 Gamma'}）</span><b class="bigv ${calm ? 'gpos' : 'gneg'}">${fmt.sbig(v.total)}</b></div>
    <p class="small-note">单位：股/每 1 元。${hide.move ? '答完第 3 题后，这里会显示股价涨 1 块时全体做市商要买卖多少股。' : `股价每涨 1 块，全体做市商要<b>${tradeText(v.move)}</b>，${calm ? '逆着涨跌买卖，让波动变小' : '顺着涨跌买卖，让波动变大'}。`}</p>
    ${hide.move ? '' : `<p class="small-note">按金额（次要）：股价每动 1%，要买卖约 ${fmt.big(dollar)} 美元。</p>`}
    <div class="state ${calm ? 'calm' : 'wild'}">${hide.flip ? (calm ? '总 GEX 为正：偏平静' : '总 GEX 为负：偏剧烈') : flipStateText(calm, v.flip, st.S)}</div>`;
  if (st.showHidden) {
    const rc = v.realTotal >= 0;
    html += `<div class="kv"><span>真实总 GEX（含看不到的盘中仓位）</span><b class="bigv ${rc ? 'gpos' : 'gneg'}">${fmt.sbig(v.realTotal)}</b></div>
      <div class="state ${rc ? 'calm' : 'wild'}">真实情况：${flipStateText(rc, v.realFlip, st.S)}</div>`;
  }
  const q = '答完这题后显示';
  html += `<div class="kv"><span>Call Wall（Call 一侧 GEX 最大）</span><b>${hide.cw ? q : v.callWall ?? '—'}</b></div>
    ${v.callWallShort && !hide.cw ? '<p class="lock">这里做市商做空 Gamma，不是天花板：股价涨过去时他们要买股票，反而推着价格涨。</p>' : ''}
    <div class="kv"><span>Put Wall（Put 一侧 GEX 绝对值最大）</span><b>${hide.pw ? q : v.putWall ?? '—'}</b></div>
    <div class="kv"><span>Gamma Flip（当前价 ±5% 内）</span><b>${hide.flip ? q : v.flip != null ? fmt.px(v.flip) : '范围内没有翻转点'}</b></div>`;
  if (st.selected) {
    const list = labCells(st).filter(c => c.K === st.selected.K && c.type === st.selected.type);
    const ctx = labCtx(st);
    const oi = list.reduce((a, c) => a + c.oi, 0), gx = list.reduce((a, c) => a + GEX.cellGex(c, st.S, ctx), 0);
    const sg = list.length ? GEX.sign(list[0], st.stance) : GEX.sign({ type: st.selected.type }, st.stance);
    const multi = st.imported && st.expiryFilter === 'all';
    html += `<div class="need"><b>选中：${st.selected.K} ${TYPE_NAME[st.selected.type]}</b>
      <div class="kv"><span>未平仓张数</span><b>${fmt.int(oi)} 张</b></div>
      <div class="kv"><span>做市商站位</span><b>${sg > 0 ? '买方（做多 Gamma）' : '卖方（做空 Gamma）'}</b></div>
      <div class="kv"><span>这一格的 GEX</span><b class="${gx >= 0 ? 'gpos' : 'gneg'}">${fmt.sbig(gx)} 股/每元</b></div>
      ${st.readOnly ? '' : `<div class="row"><button class="btn small" data-lab="oi" data-d="-10000" ${multi ? 'disabled' : ''}>−1 万张</button><button class="btn small" data-lab="oi" data-d="10000" ${multi ? 'disabled' : ''}>+1 万张</button><button class="btn small" data-lab="side">换站位</button></div>`}
      ${multi && !st.readOnly ? '<span class="small-note">多个到期日合计时不能改张数，先在下面选一个到期日。</span>' : ''}</div>`;
  }
  if (st.imported) {
    const im = st.imported;
    html += `<p class="small-note">导入的数据：${im.n} 行，标的 ${fmt.px(st.S0)}，计算时刻 ${im.asofText}。未平仓数据通常是上一交易日收盘后的统计，做市商站位为假设。</p>` +
      im.warnings.map(w => `<p class="small-note">提示：${w}</p>`).join('');
  }

}
function labCtrlHtml(st) {
  return `
    <div class="field"><span>预设分布</span><div class="presets">${['normal', 'retail', 'putpile', 'zerodte'].map(k => `<button data-preset="${k}">${PRESETS[k].name}</button>`).join('')}</div></div>
    <div class="field"><span>做市商站位假设</span><div class="seg wrap-seg"><button data-stance="default">机构卖 Call、买 Put（做市商买 Call）</button><button data-stance="retail">散户狂买 Call（做市商卖 Call）</button></div></div>

/* ---------- 第 6 关：答题 ---------- */
// 答案在答完之前不显示：每道题对应的读数先藏起来

const QUIZ = [

  { q: '第 2 题：点出 Put Wall', hint: 'Put Wall 是 Put 那一侧 GEX 绝对值最大的行权价。看 Put 柱子（紫色）哪一根离 0 线最远，点它。' },
  { q: '第 3 题：股价从这里涨 1 块，全体做市商要买还是卖、大约多少股？', hint: '看右边的总 GEX：它就是“股价每动 1 块，全体做市商要被迫买卖多少股”。正数说明他们整体做多 Gamma。' },

function round2(x) { if (!(x > 0)) return 0; const p = Math.pow(10, Math.floor(Math.log10(x)) - 1); return Math.round(x / p) * p; }
function prepQ3(st) {

function quizAnswer(ok, text) {

}
function quizPick(K) {
  const z = G.quiz, st = G.lab;

  const v = labView(st), want = z.i === 0 ? v.callWall : v.putWall, row = v.rows.find(r => r.K === want);

/* ---------- 实验室：拖竖线、拖柱子、点柱子 ---------- */
function labPoint(e) { const r = $('labCanvas').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function labFindCell(st, K, type, create) {
  let cell = st.cells.find(c => c.K === K && c.type === type && (st.expiryFilter === 'all' || c.expiry === st.expiryFilter));
  if (!cell && create) {
    cell = { K, type, oi: 0 };
    if (st.imported) {
      const ref = st.cells.find(c => st.expiryFilter === 'all' || c.expiry === st.expiryFilter);
      if (ref) { cell.minutes = ref.minutes; cell.expiry = ref.expiry; }
    }
    st.cells.push(cell);
  }
  return cell;
}
function setLabS(st, x) {
  if (st.lockPrice) { if (!UI.lockToast) { toast('先回答这道题，答完再拖股价'); UI.lockToast = true; } return; }
  const L = st._layout;
  let S = L.lo + (x - L.pad.l) / (L.w - L.pad.l - L.pad.r) * (L.hi - L.lo);
  S = Math.max(L.lo, Math.min(L.hi, S));
  st.S = Math.round(S * 20) / 20;
  scheduleRender();
}
function onLabDown(e) {
  const st = activeLab(), L = st && st._layout; if (!L) return;
  const { x, y } = labPoint(e);
  UI.lockToast = false;
  $('labCanvas').setPointerCapture(e.pointerId);
  st._frozen = [L.lo, L.hi];
  const px = L.X(st.S);
  const hit = L.hits.find(hb => x >= hb.x0 - 3 && x <= hb.x1 + 3 && y > L.pad.t && y < L.h - L.pad.b);
  if (Math.abs(x - px) < 16 || y > L.h - L.pad.b || !hit) { st._drag = { mode: 'price' }; setLabS(st, x); }
  else st._drag = { mode: 'barP', hit, y0: y, barMax: L.barMax };
  e.preventDefault();
}
function onLabMove(e) {
  const st = activeLab(), d = st && st._drag; if (!d) return;
  const { x, y } = labPoint(e);
  if (d.mode === 'price') return setLabS(st, x);
  if (d.mode === 'barP' && Math.abs(y - d.y0) > 6) {
    if (st.readOnly) return;
    if (st.imported && st.expiryFilter === 'all') { if (!d.warned) { toast('多个到期日合计时不能直接改张数，先选一个到期日'); d.warned = true; } return; }
    d.mode = 'bar';
  }
  if (d.mode !== 'bar') return;
  const L = st._layout, cell = labFindCell(st, d.hit.K, d.hit.type, true);
  const gm = GEX.gammaOf(cell, st.S, labCtx(st));
  if (gm < 1e-7) { if (!d.warned) { toast('这个行权价离股价太远，Gamma 几乎为 0，拖不动'); d.warned = true; } return; }
  const absG = Math.abs(y - L.y0) / L.half * d.barMax;
  cell.oi = Math.min(500000, Math.round(absG / (gm * MULT) / 100) * 100);
  st.version++; st.selected = { K: cell.K, type: cell.type };
  scheduleRender();
}
function onLabUp() {
  const st = activeLab(), d = st && st._drag; if (!d) return;
  st._drag = null; st._frozen = null;
  if (d.mode === 'barP') labTapBar(st, d.hit);
  render();
}
function labTapBar(st, hit) {
  if (UI.view !== 'lab' && G.level === 6) return quizPick(hit.K);
  st.selected = { K: hit.K, type: hit.type };
  if (st.readOnly) return;
  const list = labCells(st).filter(c => c.K === hit.K && c.type === hit.type);
  if (!list.length) list.push(labFindCell(st, hit.K, hit.type, true));
  const next = GEX.sign(list[0], st.stance) > 0 ? 'sell' : 'buy';
  list.forEach(c => { c.side = next; });
  st.version++;
  toast(`${hit.K} ${TYPE_NAME[hit.type]}：做市商改为${next === 'buy' ? '买方（做多 Gamma）' : '卖方（做空 Gamma）'}`);
}
function onLabSide(data) {
  const st = activeLab(); if (!st || !st.selected || st.readOnly) return;
  if (data.lab === 'oi') {
    const cell = labFindCell(st, st.selected.K, st.selected.type, true);
    cell.oi = Math.max(0, Math.min(500000, cell.oi + Number(data.d)));
  } else if (data.lab === 'side') {
    const list = labCells(st).filter(c => c.K === st.selected.K && c.type === st.selected.type);
    if (!list.length) list.push(labFindCell(st, st.selected.K, st.selected.type, true));
    const next = GEX.sign(list[0], st.stance) > 0 ? 'sell' : 'buy';
    list.forEach(c => { c.side = next; });
  }
  st.version++;
  render();
}

/* ---------- 导入 CSV ---------- */
function defaultAsof() {
  const now = Date.now(), off = CSV.etOffset(now), d = new Date(now + off * 60000);
  const p = n => String(n).padStart(2, '0');
  const sign = off < 0 ? '-' : '+', a = Math.abs(off);
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}T${p(d.getUTCHours())}:${p(d.getUTCMinutes())}${sign}${p(Math.floor(a / 60))}:${p(a % 60)}`;
}
function openImport() {
  UI.pages = null;
  $('modal').hidden = false;
  $('sheet').innerHTML = `<div class="sheet-head"><p class="eyebrow">GEX 实验室</p><h2>导入真实数据（CSV）</h2></div>
    <div class="sheet-body">
      <p>每行一个期权：到期日、行权价、类型、未平仓张数、隐含波动率（可选）。表头大小写不敏感，列顺序不限；type 写 C/P 或 call/put 都行。</p>
      <pre class="small-note" style="margin:0;white-space:pre-wrap;font-family:var(--font-num)">expiration,strike,type,open_interest,iv
2026-10-02,765,C,52340,0.142</pre>
      <label class="field"><span>粘贴文本</span><textarea id="csvText" spellcheck="false"></textarea></label>
      <label class="field"><span>或者选择文件</span><input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain" class="inp"></label>
      <div class="row">
        <label class="field" style="flex:1 1 140px"><span>标的现价</span><input class="inp" id="csvS" inputmode="decimal" placeholder="例如 767.25"></label>
        <label class="field" style="flex:2 1 200px"><span>计算时刻（美东，可写时区）</span><input class="inp" id="csvAsof" placeholder="2026-09-28T15:07-04:00"></label>
      </div>
      <p class="small-note">也可以在 CSV 第一行写：# underlying=767.25, asof=2026-09-28T15:07-04:00（会优先使用）。到期按当日 16:00 美东计算；剩余时间只算交易时段，不扣节假日。</p>
      <ul class="errs" id="csvOut"></ul>
    </div>
    <div class="sheet-foot"><button class="btn" data-imp="sample">填入示例</button><button class="btn" data-act="close">取消</button><button class="btn primary" data-imp="go">解析并导入</button></div>`;
  $('csvAsof').value = defaultAsof();
